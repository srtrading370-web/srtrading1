function afterUsers(){
  if(!Array.isArray(DB.users)) DB.users=[];
  const apf=document.getElementById('adminPasswordForm');
  if(apf) apf.onsubmit=e=>{
    e.preventDefault();
    const oldP=document.getElementById('adminOldPassword').value;
    const newP=document.getElementById('adminNewPassword').value;
    const newP2=document.getElementById('adminNewPassword2').value;
    if(oldP !== String(DB.adminPassword || '1234')){
      alert('বর্তমান Admin Password সঠিক নয়।'); return;
    }
    if(!newP || newP.length<4){
      alert('নতুন Password কমপক্ষে 4 অক্ষরের হতে হবে।'); return;
    }
    if(newP !== newP2){
      alert('নতুন Password দুইবার একই দিতে হবে।'); return;
    }
    DB.adminPassword=newP;
    saveDB();
    apf.reset();
    toast('Admin Password পরিবর্তন হয়েছে');
  };

  const form=document.getElementById('userForm');
  if(form) form.onsubmit=e=>{
    e.preventDefault();
    const name=document.getElementById('usrName').value.trim();
    const username=document.getElementById('usrUsername').value.trim();
    const newPass=document.getElementById('usrPassword').value.trim();
    const status=document.getElementById('usrStatus').value;
    const pages=[...document.querySelectorAll('.usrPagePerm:checked')].map(c=>c.value);
    if(!name || !username){ alert('নাম ও Username দিন।'); return; }
    const dupUser=DB.users.find(x=>x.username===username && x.id!==userEditId);
    const dupEmp=(DB.employees||[]).find(x=>x.username===username);
    if(dupUser || dupEmp){ alert('এই Username আগে থেকেই ব্যবহৃত হচ্ছে; অন্য একটি দিন।'); return; }
    if(userEditId){
      const i=DB.users.findIndex(x=>x.id===userEditId);
      if(i>=0) DB.users[i]={...DB.users[i], name, username, status, pages, password:newPass?newPass:(DB.users[i].password||'')};
      userEditId=null; saveDB(); toast('ইউজারের তথ্য আপডেট হয়েছে'); render();
    }else{
      if(!newPass){ alert('নতুন ইউজারের জন্য Password দিন।'); return; }
      DB.users.push({id:uid('usr'), name, username, password:newPass, status, pages, createdAt:new Date().toISOString()});
      saveDB(); toast('নতুন ইউজার যোগ হয়েছে'); render();
    }
  };

  const cancel=document.getElementById('cancelUsrEdit');
  if(cancel) cancel.onclick=()=>{userEditId=null;render();};

  const permLabel = id => { const it=NAV_ITEMS.find(x=>x.id===id); return it? it.label : id; };
  document.getElementById('userTable').innerHTML = DB.users.length ? `
  <table><thead><tr><th>নাম</th><th>Username</th><th>স্ট্যাটাস</th><th>প্রবেশাধিকার</th><th>Action</th></tr></thead><tbody>
  ${DB.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username)}</td>
    <td>${u.status==='inactive'?'<span class="tag due">Inactive</span>':'<span class="tag paid">Active</span>'}</td>
    <td style="font-size:12px;max-width:280px">${(u.pages&&u.pages.length)?u.pages.map(p=>`<span class="tag ok" style="margin:1px;display:inline-block">${esc(permLabel(p))}</span>`).join(''):'<span class="small-note">কোনো পেজ নির্বাচিত নেই</span>'}</td>
    <td><button class="btn small" data-edit-usr="${u.id}">Edit</button> <button class="btn small danger" data-del-usr="${u.id}">Delete</button></td></tr>`).join('')}
  </tbody></table>` : '<div class="empty">কোনো ইউজার যোগ করা হয়নি।</div>';

  document.querySelectorAll('[data-edit-usr]').forEach(b=>b.onclick=()=>{ userEditId=b.dataset.editUsr; render(); });
  document.querySelectorAll('[data-del-usr]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.delUsr;
    if(confirm('এই ইউজারটি মুছে ফেলবেন?')){ DB.users=DB.users.filter(x=>x.id!==id); saveDB(); render(); }
  });
}

/* =========================================================
   12. BACKUP / RESTORE
========================================================= */
function renderBackup(){
  return `
  <div class="panel">
    <div class="panel-head"><h3>Backup</h3></div>
    <div class="panel-body">
      <p style="font-size:13.5px;color:var(--muted);">সম্পূর্ণ ডাটাবেজ একটি JSON ফাইল হিসেবে Download করুন। এই ফাইলটি নিরাপদ স্থানে রাখুন — পরবর্তীতে Restore করে সব তথ্য ফিরিয়ে আনতে পারবেন।</p>
      <button class="btn gold" id="backupBtn">Backup Download করুন</button>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>Restore</h3></div>
    <div class="panel-body">
      <p style="font-size:13.5px;color:var(--muted);">আগে Download করা Backup (.json) ফাইল আপলোড করুন। <b style="color:var(--red);">সতর্কতা:</b> এটি বর্তমান সকল ডাটা প্রতিস্থাপন করবে।</p>
      <input type="file" id="restoreFile" accept="application/json">
      <div class="form-actions"><button class="btn danger" id="restoreBtn">Restore করুন</button></div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>নির্বাচিত ডাটা মুছে ফেলুন</h3></div>
    <div class="panel-body">
      <p style="font-size:13.5px;color:var(--muted);">এখান থেকে শুধু নির্বাচিত হিসাব/লেনদেন মুছে ফেলা যাবে। <b style="color:var(--red);">এই কাজ Undo করা যাবে না।</b> প্রয়োজন হলে আগে Backup নিন।</p>
      <div class="form-grid two">
        <button class="btn danger" id="clearSalesBtn" type="button">সব Sales Invoice মুছুন (${DB.sales.length})</button>
        <button class="btn danger" id="clearLiftingBtn" type="button">সব Lifting Invoice মুছুন (${DB.liftings.length})</button>
        <button class="btn danger" id="clearSupplierBtn" type="button">সব Supplier Payment মুছুন (${DB.supplierPayments.length})</button>
        <button class="btn danger" id="clearOpeningBtn" type="button">সব Opening Stock = 0 করুন</button>
      </div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>ডাটা পরিসংখ্যান</h3></div>
    <div class="panel-body">
      <div class="grid-cards">
        <div class="stat-card"><div class="lbl">কোম্পানি</div><div class="val">${DB.companies.length}</div></div>
        <div class="stat-card"><div class="lbl">Product</div><div class="val">${DB.products.length}</div></div>
        <div class="stat-card"><div class="lbl">Lifting Invoice</div><div class="val">${DB.liftings.length}</div></div>
        <div class="stat-card"><div class="lbl">Sales Invoice</div><div class="val">${DB.sales.length}</div></div>
        <div class="stat-card"><div class="lbl">Supplier Payment</div><div class="val">${DB.supplierPayments.length}</div></div>
      </div>
    </div>
  </div>`;
}
function afterBackup(){
  document.getElementById('backupBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `dms-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Backup Download হচ্ছে');
  });
  document.getElementById('clearSalesBtn').addEventListener('click', ()=>{
    if(!DB.sales.length){ alert('কোনো Sales Invoice নেই।'); return; }
    if(!confirm(`সব ${DB.sales.length}টি Sales Invoice এবং সংশ্লিষ্ট Sales Return মুছে ফেলবেন? এই কাজ Undo করা যাবে না।`)) return;
    const ids = new Set(DB.sales.map(s=>s.id));
    const invoiceNos = new Set(DB.sales.map(s=>s.invoiceNo));
    DB.sales = [];
    DB.salesReturns = DB.salesReturns.filter(r=>!ids.has(r.salesId));
    DB.cashbook = DB.cashbook.filter(c=>!(c.source==='sales' && [...invoiceNos].some(no=>String(c.note||'').includes(no))));
    saveDB(); toast('সব Sales Invoice মুছে ফেলা হয়েছে'); render();
  });
  document.getElementById('clearLiftingBtn').addEventListener('click', ()=>{
    if(!DB.liftings.length){ alert('কোনো Lifting Invoice নেই।'); return; }
    if(!confirm(`সব ${DB.liftings.length}টি Lifting Invoice মুছে ফেলবেন? এই কাজ Undo করা যাবে না।`)) return;
    const invoiceNos = new Set(DB.liftings.map(l=>l.invoiceNo));
    DB.liftings = [];
    DB.cashbook = DB.cashbook.filter(c=>!(c.source==='lifting' && [...invoiceNos].some(no=>String(c.note||'').includes(no))));
    saveDB(); toast('সব Lifting Invoice মুছে ফেলা হয়েছে'); render();
  });
  document.getElementById('clearSupplierBtn').addEventListener('click', ()=>{
    if(!DB.supplierPayments.length){ alert('কোনো Supplier Payment নেই।'); return; }
    if(!confirm(`সব ${DB.supplierPayments.length}টি Supplier Payment মুছে ফেলবেন? এই কাজ Undo করা যাবে না।`)) return;
    DB.supplierPayments = [];
    DB.cashbook = DB.cashbook.filter(c=>c.source!=='supplier-payment');
    saveDB(); toast('সব Supplier Payment মুছে ফেলা হয়েছে'); render();
  });
  document.getElementById('clearOpeningBtn').addEventListener('click', ()=>{
    const count = DB.products.filter(p=>Number(p.openingStock||0)!==0).length;
    if(!count){ alert('কোনো Opening Stock সেট করা নেই।'); return; }
    if(!confirm(`সব ${count}টি Product-এর Opening Stock 0 করে দেবেন? বর্তমান Opening Stock মানগুলো মুছে যাবে।`)) return;
    DB.products.forEach(p=>{ p.openingStock = 0; });
    saveDB(); toast('সব Opening Stock 0 করা হয়েছে'); render();
  });

  document.getElementById('restoreBtn').addEventListener('click', ()=>{
    const file = document.getElementById('restoreFile').files[0];
    if(!file){ alert('একটি Backup ফাইল নির্বাচন করুন।'); return; }
    if(!confirm('বর্তমান সব ডাটা মুছে ব্যাকআপ থেকে Restore করা হবে। নিশ্চিত?')) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        DB = Object.assign(emptyDB(), parsed);
        saveDB();
        toast('Restore সম্পন্ন হয়েছে');
        render();
      }catch(e){ alert('ফাইলটি সঠিক নয় বা corrupted।'); }
    };
    reader.readAsText(file);
  });
}

document.getElementById('loginScreen').style.display='flex';
restoreSession();
</script>

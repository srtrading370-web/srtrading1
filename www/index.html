}

function afterSalary(){
  if(!Array.isArray(DB.employees)) DB.employees=[];
  if(!Array.isArray(DB.salaryPayments)) DB.salaryPayments=[];

  const form=document.getElementById('employeeForm');
  if(form) form.onsubmit=e=>{
    e.preventDefault();
    const data={
      name:document.getElementById('empName').value.trim(),
      address:document.getElementById('empAddress').value.trim(),
      idNo:document.getElementById('empIdNo').value.trim(),
      phone:document.getElementById('empPhone').value.trim(),
      designation:document.getElementById('empDesignation').value.trim(),
      salary:Number(document.getElementById('empSalary').value||0),
      joinDate:document.getElementById('empJoinDate').value||todayStr(),
      status:document.getElementById('empStatus').value,
      username:document.getElementById('empUsername').value.trim()
    };
    const newPass=document.getElementById('empPassword').value.trim();
    if(!data.name || data.salary<0){alert('নাম ও সঠিক বেতন দিন।');return;}
    if(data.username){
      const dup=DB.employees.find(x=>x.username && x.username===data.username && x.id!==salaryEditId);
      if(dup){alert('এই Username আগে থেকেই ব্যবহৃত হচ্ছে; অন্য একটি দিন।');return;}
    }
    if(salaryEditId){
      const i=DB.employees.findIndex(x=>x.id===salaryEditId);
      if(i>=0) DB.employees[i]={...DB.employees[i],...data,password:newPass?newPass:(DB.employees[i].password||'')};
      salaryEditId=null; saveDB(); toast('কর্মচারীর তথ্য আপডেট হয়েছে'); render();
    }else{
      DB.employees.push({id:uid('emp'),...data,password:newPass,createdAt:new Date().toISOString()});
      saveDB(); toast('কর্মচারী যোগ হয়েছে'); render();
    }
  };

  const cancel=document.getElementById('cancelEmpEdit');
  if(cancel) cancel.onclick=()=>{salaryEditId=null;render();};

  const payForm=document.getElementById('salaryPayForm');
  if(payForm) payForm.onsubmit=e=>{
    e.preventDefault();
    const employeeId=document.getElementById('payEmp').value;
    const emp=DB.employees.find(x=>x.id===employeeId);
    const amount=Number(document.getElementById('payAmount').value||0);
    if(!emp || amount<=0){alert('কর্মচারী ও সঠিক টাকা নির্বাচন করুন।');return;}
    const type=document.getElementById('payType').value;
    const typeName={advance:'অগ্রিম বেতন',salary:'মাসিক বেতন',bonus:'বোনাস',other:'অন্যান্য'}[type];
    const row={id:uid('sp'),employeeId,employeeName:emp.name,type,typeName,date:document.getElementById('payDate').value||todayStr(),amount,note:document.getElementById('payNote').value.trim()};
    DB.salaryPayments.push(row);
    DB.cashbook.push({id:uid('cb'),date:row.date,type:'out',category:'salary',categoryName:'বেতন ও অগ্রিম',amount:row.amount,note:`${row.typeName} — ${row.employeeName}${row.note?' — '+row.note:''}`,source:'salary',refId:row.id});
    saveDB(); toast('বেতন/অগ্রিম সংরক্ষণ হয়েছে এবং Cashbook-এ খরচ যোগ হয়েছে'); render();
  };

  function drawSalary(){
    const preset=document.getElementById('salaryPreset'), from=document.getElementById('salaryFrom'), to=document.getElementById('salaryTo');
    function setPreset(){
      const d=new Date(); let f=new Date(d), t=new Date(d);
      if(preset.value==='monthly') f=new Date(d.getFullYear(),d.getMonth(),1);
      else if(preset.value==='yearly') f=new Date(d.getFullYear(),0,1);
      else if(preset.value==='custom') return;
      from.value=f.toISOString().slice(0,10); to.value=t.toISOString().slice(0,10); draw();
    }
    function draw(){
      let pays=[...DB.salaryPayments].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
      if(from.value) pays=pays.filter(x=>x.date>=from.value);
      if(to.value) pays=pays.filter(x=>x.date<=to.value);

      document.getElementById('employeeTable').innerHTML=DB.employees.length?`
      <h4>👥 কর্মচারীদের তালিকা</h4>
      <table><thead><tr><th>নাম</th><th>পদবি</th><th>আইডি</th><th>মোবাইল</th><th>মাসিক বেতন</th><th>মোট অগ্রিম</th><th>স্ট্যাটাস</th><th>লগইন</th><th>Action</th></tr></thead><tbody>
      ${DB.employees.map(e=>{
        const adv=DB.salaryPayments.filter(x=>x.employeeId===e.id&&x.type==='advance').reduce((s,x)=>s+Number(x.amount||0),0);
        return `<tr><td><b>${esc(e.name)}</b><div class="small-note">${esc(e.address||'')}</div></td><td>${esc(e.designation||'—')}</td><td>${esc(e.idNo||'—')}</td><td>${esc(e.phone||'—')}</td><td>${money(e.salary)}</td><td>${money(adv)}</td><td>${e.status==='active'?'<span class="tag paid">Active</span>':'<span class="tag due">Inactive</span>'}</td><td>${e.username?`<span class="tag ok">${esc(e.username)}</span>`:'<span class="small-note">নেই</span>'}</td><td><button class="btn small" data-edit-emp="${e.id}">Edit</button> <button class="btn small danger" data-del-emp="${e.id}">Delete</button></td></tr>`;
      }).join('')}</tbody></table>`:'<div class="empty">কোনো কর্মচারী যোগ করা হয়নি।</div>';

      document.getElementById('salaryPaymentTable').innerHTML=pays.length?`
      <h4>💳 Salary / Advance Payment History</h4>
      <table><thead><tr><th>তারিখ</th><th>কর্মচারী</th><th>ধরন</th><th>পরিমাণ</th><th>নোট</th><th>Action</th></tr></thead><tbody>
      ${pays.map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(p.employeeName)}</td><td>${esc(p.typeName)}</td><td>${money(p.amount)}</td><td>${esc(p.note||'—')}</td><td><button class="btn small danger" data-del-pay="${p.id}">Delete</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">নির্বাচিত সময়ে কোনো Salary/Advance নেই।</div>';

      document.querySelectorAll('[data-edit-emp]').forEach(b=>b.onclick=()=>{salaryEditId=b.dataset.editEmp;render();});
      document.querySelectorAll('[data-del-emp]').forEach(b=>b.onclick=()=>{
        const id=b.dataset.delEmp;
        if(DB.salaryPayments.some(x=>x.employeeId===id)){alert('এই কর্মচারীর পেমেন্ট হিসাব আছে; আগে হিসাব পর্যালোচনা করুন।');return;}
        if(confirm('কর্মচারীটি মুছে ফেলবেন?')){DB.employees=DB.employees.filter(x=>x.id!==id);saveDB();render();}
      });
      document.querySelectorAll('[data-del-pay]').forEach(b=>b.onclick=()=>{
        const id=b.dataset.delPay;
        if(confirm('এই Salary/Advance payment মুছে ফেলবেন?')){
          DB.salaryPayments=DB.salaryPayments.filter(x=>x.id!==id);
          DB.cashbook=DB.cashbook.filter(x=>!(x.source==='salary'&&x.refId===id));
          saveDB();render();
        }
      });
    }
    preset.onchange=setPreset;
    from.onchange=()=>{preset.value='custom';draw();};
    to.onchange=()=>{preset.value='custom';draw();};

    document.getElementById('salaryPdf').onclick=()=>{
      const rows=[...DB.salaryPayments].filter(x=>(!from.value||x.date>=from.value)&&(!to.value||x.date<=to.value)).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
      const total=rows.reduce((s,x)=>s+Number(x.amount||0),0);
      const w=window.open('','_blank'); if(!w)return;
      w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Salary Report</title><style>
      body{font-family:'Noto Sans Bengali','Hind Siliguri',Arial,sans-serif;padding:24px;color:#111}h2{text-align:center;margin:0 0 6px}p{text-align:center;color:#555}
      table{width:100%;border-collapse:collapse;margin-top:16px}th,td{border:1px solid #999;padding:7px;text-align:left}th{background:#eee}.total{text-align:right;font-size:18px;font-weight:bold;margin-top:14px}
      </style></head><body><h2>S R Trading — Salary Report</h2><p>Nababbari chowmini, Addarsha cumilla.</p><p>সময়কাল: ${esc(from.value||'—')} থেকে ${esc(to.value||'—')}</p>
      <table><thead><tr><th>ক্রমিক</th><th>তারিখ</th><th>কর্মচারী</th><th>ধরন</th><th>পরিমাণ</th><th>নোট</th></tr></thead>
      <tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.date)}</td><td>${esc(r.employeeName)}</td><td>${esc(r.typeName)}</td><td>${money(r.amount)}</td><td>${esc(r.note||'—')}</td></tr>`).join('')}</tbody></table>
      <div class="total">মোট প্রদান: ${money(total)}</div><script>window.print()<\/script></body></html>`); w.document.close();
    };
    setPreset();
  }
}

/* =========================================================
   9. DAILY BAKI LIST — INDEPENDENT MANUAL LIST
   This module is intentionally NOT linked to Sales, Invoice,
   Customer Baki, Collection, Cashbook, or any other module.
========================================================= */
function renderDailyBaki(){
  if(!Array.isArray(DB.dailyBakiList)) DB.dailyBakiList=[];
  const formDate = document.getElementById('dbDate')?.value || todayStr();
  const date = document.getElementById('dbFilterDate')?.value || formDate;
  const marketFilter = document.getElementById('dbFilterMarket')?.value || '';
  const dateRows = DB.dailyBakiList
    .filter(x=>String(x.date||'')===String(date||''))
    .sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
  const rows = marketFilter ? dateRows.filter(x=>String(x.market||'')===marketFilter) : dateRows;
  const total = rows.reduce((a,x)=>a+Number(x.amount||0),0);
  const marketOptions = [...new Set(DB.dailyBakiList.map(x=>x.market).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'bn'));
  const yearOptions = [...new Set([...DB.dailyBakiList.map(x=>String(x.date||'').slice(0,4)).filter(Boolean), String(todayStr()).slice(0,4)])].sort((a,b)=>b.localeCompare(a));
  // মার্কেট অনুযায়ী এই তারিখের মোট বাকি — সব মার্কেট (ফিল্টার নির্বিশেষে)
  const marketGroups = {};
  dateRows.forEach(x=>{
    const m = x.market || 'মার্কেট উল্লেখ নেই';
    if(!marketGroups[m]) marketGroups[m] = {count:0, total:0};
    marketGroups[m].count++; marketGroups[m].total += Number(x.amount||0);
  });
  const marketSummary = Object.entries(marketGroups).sort((a,b)=>b[1].total-a[1].total);

  // ===== দৈনিক/সাপ্তাহিক/মাসিক/বাৎসরিক — সব একসাথে সারসংক্ষেপ =====
  const [rY,rM,rD] = String(date).split('-').map(Number);
  const baseD = new Date(rY, (rM||1)-1, rD||1);
  const dow = baseD.getDay(); // 0=Sun..6=Sat
  const weekStartD = new Date(baseD); weekStartD.setDate(baseD.getDate()-dow);
  const weekEndD = new Date(weekStartD); weekEndD.setDate(weekStartD.getDate()+6);
  const toYMD = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const weekStart = toYMD(weekStartD), weekEnd = toYMD(weekEndD);
  const ymNow = String(date).slice(0,7);
  const yNow = String(date).slice(0,4);
  const inRange = (d,a,b) => String(d||'') >= a && String(d||'') <= b;
  const sumFilter = fn => { const r = DB.dailyBakiList.filter(fn); return {rows:r, count:r.length, total:r.reduce((a,x)=>a+Number(x.amount||0),0)}; };
  const rangeDaily = sumFilter(x=>String(x.date||'')===String(date||''));
  const rangeWeekly = sumFilter(x=>inRange(x.date, weekStart, weekEnd));
  const rangeMonthly = sumFilter(x=>String(x.date||'').slice(0,7)===ymNow);
  const rangeYearly = sumFilter(x=>String(x.date||'').slice(0,4)===yNow);
  const rangeAllTime = sumFilter(()=>true);

  // ===== কাস্টম তারিখ রেঞ্জ (যেমন ১-৩০, বা ১ জানুয়ারি - ৩১ ডিসেম্বর) =====
  const rangeFrom = document.getElementById('dbRangeFrom')?.value || `${ymNow}-01`;
  const rangeTo = document.getElementById('dbRangeTo')?.value || date;
  const rangeMarketFilter = document.getElementById('dbRangeMarket')?.value || '';
  const customRangeAll = sumFilter(x=>inRange(x.date, rangeFrom, rangeTo));
  const customRange = rangeMarketFilter ? {
    rows: customRangeAll.rows.filter(x=>String(x.market||'')===rangeMarketFilter),
    count: 0, total: 0
  } : customRangeAll;
  if(rangeMarketFilter){ customRange.count = customRange.rows.length; customRange.total = customRange.rows.reduce((a,x)=>a+Number(x.amount||0),0); }
  const customRangeSorted = customRange.rows.slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')) || String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
  const customMarketGroups = {};
  customRangeAll.rows.forEach(x=>{
    const m = x.market || 'মার্কেট উল্লেখ নেই';
    if(!customMarketGroups[m]) customMarketGroups[m] = {count:0, total:0};
    customMarketGroups[m].count++; customMarketGroups[m].total += Number(x.amount||0);
  });
  const customMarketSummary = Object.entries(customMarketGroups).sort((a,b)=>b[1].total-a[1].total);

  return `
  <div class="panel">
    <div class="panel-head"><h3>📊 সব রিপোর্ট একসাথে — দৈনিক / সাপ্তাহিক / মাসিক / বাৎসরিক</h3></div>
    <div class="panel-body">
      <div class="small-note" style="margin-bottom:12px;">তারিখ <b>${esc(date)}</b> ভিত্তি ধরে হিসাব করা হয়েছে। সপ্তাহ: ${esc(weekStart)} — ${esc(weekEnd)} | মাস: ${esc(ymNow)} | বছর: ${esc(yNow)}</div>
      <div class="form-grid" style="margin-bottom:12px;max-width:260px">
        <div class="f-item"><label>বছর পাল্টে দেখুন (আগের বছরের রিপোর্ট)</label><select id="dbYearSelect">
          ${yearOptions.map(y=>`<option value="${esc(y)}"${yNow===y?' selected':''}>${esc(y)}</option>`).join('')}
        </select></div>
      </div>
      <div class="grid-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px;">
        <div class="stat-card"><div class="lbl">📅 দৈনিক বাকি (${esc(date)})</div><div class="val">${money(rangeDaily.total)}</div><div class="small-note">${rangeDaily.count} এন্ট্রি</div></div>
        <div class="stat-card"><div class="lbl">🗓️ সাপ্তাহিক বাকি</div><div class="val">${money(rangeWeekly.total)}</div><div class="small-note">${rangeWeekly.count} এন্ট্রি</div></div>
        <div class="stat-card"><div class="lbl">📆 মাসিক বাকি (${esc(ymNow)})</div><div class="val">${money(rangeMonthly.total)}</div><div class="small-note">${rangeMonthly.count} এন্ট্রি</div></div>
        <div class="stat-card red"><div class="lbl">📈 বাৎসরিক বাকি (${esc(yNow)})</div><div class="val">${money(rangeYearly.total)}</div><div class="small-note">${rangeYearly.count} এন্ট্রি</div></div>
        <div class="stat-card" style="border-left-color:#000"><div class="lbl">🧮 সর্বমোট বাকি (সব তারিখ, সব মার্কেট)</div><div class="val">${money(rangeAllTime.total)}</div><div class="small-note">${rangeAllTime.count} এন্ট্রি</div></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="btn" id="dbAllPrintDaily">📄 দৈনিক PDF</button>
        <button type="button" class="btn" id="dbAllPrintWeekly">📄 সাপ্তাহিক PDF</button>
        <button type="button" class="btn" id="dbAllPrintMonthly">📄 মাসিক PDF</button>
        <button type="button" class="btn gold" id="dbAllPrintYearly">📄 বাৎসরিক PDF</button>
        <button type="button" class="btn gold" id="dbAllPrintGrandTotal">📄 সর্বমোট PDF</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>🗓️ কাস্টম তারিখ রেঞ্জ রিপোর্ট</h3></div>
    <div class="panel-body">
      <div class="small-note" style="margin-bottom:12px;">
        নিজের পছন্দমতো যেকোনো তারিখ থেকে যেকোনো তারিখ পর্যন্ত দেখুন — যেমন <b>১ থেকে ৩০</b> তারিখ, অথবা <b>১ জানুয়ারি থেকে ৩১ ডিসেম্বর</b>।
      </div>
      <div class="form-grid two" style="margin-bottom:12px">
        <div class="f-item"><label>শুরুর তারিখ (From)</label><input type="date" id="dbRangeFrom" value="${esc(rangeFrom)}"></div>
        <div class="f-item"><label>শেষ তারিখ (To)</label><input type="date" id="dbRangeTo" value="${esc(rangeTo)}"></div>
      </div>
      <div class="form-grid" style="margin-bottom:12px">
        <div class="f-item"><label>মার্কেট</label><select id="dbRangeMarket">
          <option value="">— সকল মার্কেট একসাথে —</option>
          ${marketOptions.map(m=>`<option value="${esc(m)}"${rangeMarketFilter===m?' selected':''}>${esc(m)}</option>`).join('')}
        </select></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        <button type="button" class="btn small" id="dbRangeThisMonth">📆 এই মাসের ১ — শেষ তারিখ</button>
        <button type="button" class="btn small" id="dbRangeThisYear">📈 ১ জানুয়ারি — ৩১ ডিসেম্বর</button>
        <button type="button" class="btn small" id="dbRangeApply">🔍 দেখুন</button>
        <button type="button" class="btn gold" id="dbRangePdf">📄 PDF রিপোর্ট</button>
      </div>
      <div class="stat-card red" style="margin-bottom:14px">
        <div class="lbl">${esc(rangeFrom)} — ${esc(rangeTo)}${rangeMarketFilter?' | মার্কেট: '+esc(rangeMarketFilter):' | সকল মার্কেট একসাথে'} — মোট বাকি</div>
        <div class="val">${money(customRange.total)}</div>
        <div class="small-note">${customRange.count} এন্ট্রি</div>
      </div>
      ${customMarketSummary.length>1 ? `<div class="table-wrap" style="margin-bottom:14px">
        <table><thead><tr><th>মার্কেট</th><th>এন্ট্রি সংখ্যা</th><th>মোট বাকি</th><th></th></tr></thead><tbody>
        ${customMarketSummary.map(([m,g])=>`<tr${rangeMarketFilter===m?' style="background:#fff7e6"':''}><td><b>${esc(m)}</b></td><td>${g.count}</td><td><b>${money(g.total)}</b></td>
        <td><button type="button" class="btn small" data-select-range-market="${esc(m)}">${rangeMarketFilter===m?'✓ নির্বাচিত':'এই মার্কেট দেখুন'}</button></td></tr>`).join('')}
        </tbody></table>
      </div>` : ''}
      <div class="table-wrap">
        ${customRangeSorted.length ? `<table><thead><tr><th>ক্রমিক</th><th>তারিখ</th><th>মার্কেট</th><th>দোকানদারের নাম</th><th>ঠিকানা</th><th>বাকি Amount</th><th>নোট</th></tr></thead><tbody>
        ${customRangeSorted.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.date)}</td><td>${esc(x.market||'—')}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.address||'—')}</td><td><b>${money(x.amount)}</b></td><td>${esc(x.note||'—')}</td></tr>`).join('')}
        </tbody></table>` : `<div class="empty">এই সময়ের মধ্যে কোনো বাকি এন্ট্রি নেই।</div>`}

  <div class="panel">
    <div class="panel-head"><h3>📝 দৈনিক বাকি লিস্ট</h3></div>
    <div class="panel-body">

        এটি একটি <b>স্বতন্ত্র বাকি লিস্ট</b>। এখানে দেওয়া তথ্য কোনো Sales Invoice, Customer Baki, Collection, Cashbook, Stock বা অন্য কোনো হিসাবের সাথে যুক্ত হবে না।

        <div class="f-item"><label>তারিখ *</label><input type="date" id="dbDate" value="${esc(formDate)}" required></div>
        <div class="f-item"><label>মার্কেট *</label><input type="text" id="dbMarket" list="dbMarketList" placeholder="মার্কেটের নাম" required>
          <datalist id="dbMarketList">${marketOptions.map(m=>`<option value="${esc(m)}">`).join('')}</datalist>
        </div>
        <div class="f-item"><label>বাকি দোকানদারের নাম *</label><input type="text" id="dbName" placeholder="দোকানদারের নাম" required></div>
        <div class="f-item"><label>ঠিকানা</label><input type="text" id="dbAddress" placeholder="দোকানের/দোকানদারের ঠিকানা"></div>
        <div class="f-item"><label>বাকি টাকার পরিমাণ *</label><input type="number" id="dbAmount" min="0" step="0.01" placeholder="৳ Amount" required></div>
        <div class="f-item" style="grid-column:1/-1"><label>নোট</label><textarea id="dbNote" rows="2" placeholder="প্রয়োজনীয় নোট লিখুন"></textarea></div>
        <div class="f-item" style="align-self:end"><button type="submit" class="btn gold" style="width:100%">💾 বাকি লিস্টে যোগ করুন</button></div>
      </form>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>🏪 মার্কেট অনুযায়ী মোট বাকি (${esc(date)})</h3></div>
    <div class="panel-body table-wrap">
      ${marketSummary.length ? `<table><thead><tr><th>মার্কেট</th><th>এন্ট্রি সংখ্যা</th><th>মোট বাকি</th><th></th></tr></thead><tbody>
      ${marketSummary.map(([m,g])=>`<tr${marketFilter===m?' style="background:#fff7e6"':''}><td><b>${esc(m)}</b></td><td>${g.count}</td><td><b>${money(g.total)}</b></td>
      <td><button type="button" class="btn small" data-select-market="${esc(m)}">${marketFilter===m?'✓ নির্বাচিত':'এই মার্কেট দেখুন'}</button></td></tr>`).join('')}
      </tbody></table>` : `<div class="empty">এই তারিখে কোনো বাকি এন্ট্রি নেই।</div>`}
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>📅 তারিখ ও মার্কেট অনুযায়ী বাকি লিস্ট</h3></div>
    <div class="panel-body">
      <div class="form-grid two" style="margin-bottom:14px">
        <div class="f-item"><label>যে তারিখের বাকি দেখবেন</label><input type="date" id="dbFilterDate" value="${esc(date)}"></div>
        <div class="f-item"><label>মার্কেট ফিল্টার</label><select id="dbFilterMarket">
          <option value="">— সব মার্কেট —</option>
          ${marketOptions.map(m=>`<option value="${esc(m)}"${marketFilter===m?' selected':''}>${esc(m)}</option>`).join('')}
        </select></div>
      </div>
      <div class="form-grid" style="margin-bottom:14px">
        <div class="f-item">
          <label>PDF রিপোর্ট</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="btn" id="dbPrintDirectBtn">🖨️ প্রিন্ট</button>
            <button type="button" class="btn" id="dbPrintBtn">📄 দৈনিক PDF</button>
            <button type="button" class="btn gold" id="dbMonthlyPrintBtn">📄 মাসিক PDF</button><button type="button" class="btn" id="dbPaymentBtn">💳 Payment</button>
          </div>
        </div>
      </div>
      <div class="stat-card red" style="margin-bottom:14px"><div class="lbl">${marketFilter?esc(marketFilter)+'-এর মোট বাকি':'এই দিনের মোট বাকি'}</div><div class="val">${money(total)}</div></div>
      <div class="table-wrap">
        ${rows.length ? `<table id="dailyBakiTable"><thead><tr><th>ক্রমিক</th><th>তারিখ</th><th>মার্কেট</th><th>দোকানদারের নাম</th><th>ঠিকানা</th><th>বাকি Amount</th><th>নোট</th><th>Payment</th><th>Action</th></tr></thead><tbody>
        ${rows.map((x,i)=>`<tr>
          <td>${i+1}</td><td>${esc(x.date)}</td><td>${esc(x.market||'—')}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.address||'—')}</td><td><b>${money(x.amount)}</b> ${Number(x.amount||0)<=0?'<span class="tag paid">জিরো</span>':''}</td><td>${esc(x.note||'—')}</td>
          <td>${Number(x.amount||0)>0?`<button class="btn small gold" data-pay-daily-baki="${esc(x.id)}">💳 Payment</button>`:'<span class="tag paid">পরিশোধিত</span>'}</td>
          <td>${isAdmin()?`<button class="btn small" data-edit-daily-baki="${esc(x.id)}">Edit</button> <button class="btn small danger" data-del-daily-baki="${esc(x.id)}">Delete</button>`:''}</td>
        </tr>`).join('')}
        </tbody></table>` : `<div class="empty">এই তারিখে (${marketFilter?esc(marketFilter)+' মার্কেটে ':''}) কোনো বাকি এন্ট্রি নেই।</div>`}
      </div>
    </div>
  </div>`;
}
function afterDailyBaki(){
  if(!Array.isArray(DB.dailyBakiList)) DB.dailyBakiList=[];
  const form=document.getElementById('dailyBakiForm');
  const filter=document.getElementById('dbFilterDate');
  const yearSelect=document.getElementById('dbYearSelect');
  if(yearSelect) yearSelect.onchange=()=>{
    const y=yearSelect.value;
    if(filter) filter.value=`${y}-12-31`;
    const rf=document.getElementById('dbRangeFrom');
    const rt=document.getElementById('dbRangeTo');
    if(rf) rf.value=`${y}-01-01`;
    if(rt) rt.value=`${y}-12-31`;
    render();
  };
  if(form) form.onsubmit=e=>{
    e.preventDefault();
    const date=document.getElementById('dbDate').value||todayStr();
    const market=document.getElementById('dbMarket').value.trim();
    const name=document.getElementById('dbName').value.trim();
    const address=document.getElementById('dbAddress').value.trim();
    const amount=Number(document.getElementById('dbAmount').value||0);
    const note=document.getElementById('dbNote').value.trim();
    if(!market){alert('মার্কেটের নাম লিখুন।');return;}
    if(!name){alert('দোকানদারের নাম লিখুন।');return;}
    if(amount<0 || Number.isNaN(amount)){alert('বাকি টাকার পরিমাণ সঠিক নয়।');return;}
    DB.dailyBakiList.push({id:uid('db'),date,market,name,address,amount,note,createdAt:new Date().toISOString()});
    saveDB(); toast('দৈনিক বাকি লিস্টে এন্ট্রি যোগ হয়েছে'); render();
  };
  if(filter) filter.onchange=()=>{ render(); };
  const marketFilterEl=document.getElementById('dbFilterMarket');
  if(marketFilterEl) marketFilterEl.onchange=()=>{ render(); };
  document.querySelectorAll('[data-select-market]').forEach(btn=>btn.addEventListener('click',()=>{
    const sel=document.getElementById('dbFilterMarket');
    if(!sel) return;
    sel.value = sel.value===btn.dataset.selectMarket ? '' : btn.dataset.selectMarket;
    render();
  }));
  document.querySelectorAll('[data-edit-daily-baki]').forEach(btn=>btn.addEventListener('click',()=>{
    const x=DB.dailyBakiList.find(v=>v.id===btn.dataset.editDailyBaki); if(!x)return;
    const date=prompt('তারিখ লিখুন (YYYY-MM-DD):',x.date); if(date===null)return;
    const market=prompt('মার্কেট:',x.market||''); if(market===null)return;
    const name=prompt('দোকানদারের নাম:',x.name); if(name===null)return;
    const address=prompt('ঠিকানা:',x.address||''); if(address===null)return;
    const amount=prompt('বাকি টাকার পরিমাণ:',String(x.amount)); if(amount===null)return;
    const note=prompt('নোট:',x.note||''); if(note===null)return;
    const n=Number(amount); if(!name.trim()||!market.trim()||Number.isNaN(n)||n<0){alert('তথ্য সঠিক নয়।');return;}
    x.date=date.trim()||x.date; x.market=market.trim(); x.name=name.trim(); x.address=address.trim(); x.amount=n; x.note=note.trim();
    saveDB(); toast('বাকি এন্ট্রি আপডেট হয়েছে'); render();
  }));
  document.querySelectorAll('[data-pay-daily-baki]').forEach(btn=>btn.addEventListener('click',()=>{
    const x=DB.dailyBakiList.find(v=>v.id===btn.dataset.payDailyBaki); if(!x)return;
    const current=Math.max(Number(x.amount||0),0);
    if(current<=0){ toast('এই বাকি ইতিমধ্যে জিরো।'); return; }
    const payment=prompt(`${x.name}-এর বর্তমান বাকি ${money(current)}\nকত টাকা Payment দিলেন?`,String(current));
    if(payment===null)return;
    const n=Number(payment);
    if(!Number.isFinite(n)||n<=0){alert('সঠিক Payment Amount দিন।');return;}
    if(n>current){alert(`Payment বর্তমান বাকি ${money(current)}-এর বেশি হতে পারবে না।`);return;}
    x.amount=Math.max(current-n,0);
    x.lastPayment=n;
    x.lastPaymentDate=todayStr();
    saveDB();
    toast(x.amount===0 ? `${x.name}-এর বাকি সম্পূর্ণ পরিশোধ হয়েছে — এখন জিরো।` : `${money(n)} Payment নেওয়া হয়েছে। অবশিষ্ট ${money(x.amount)}`);
    render();
  }));
  document.querySelectorAll('[data-del-daily-baki]').forEach(btn=>btn.addEventListener('click',()=>{
    const x=DB.dailyBakiList.find(v=>v.id===btn.dataset.delDailyBaki); if(!x)return;
    if(!confirm(`${x.name}-এর বাকি এন্ট্রি মুছে ফেলবেন?`))return;
    DB.dailyBakiList=DB.dailyBakiList.filter(v=>v.id!==x.id); saveDB(); toast('বাকি এন্ট্রি মুছে ফেলা হয়েছে'); render();
  }));
  function openBakiPdfReport(title, subtitle, rows){
    const total=rows.reduce((a,x)=>a+Number(x.amount||0),0);
    const groups={};
    rows.forEach(x=>{const m=x.market||'মার্কেট উল্লেখ নেই';if(!groups[m])groups[m]={count:0,total:0};groups[m].count++;groups[m].total+=Number(x.amount||0);});
    const marketRows=Object.entries(groups).sort((a,b)=>b[1].total-a[1].total);
    const w=window.open('','_blank'); if(!w)return;
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title>
    <style>
      body{font-family:'Noto Sans Bengali','Hind Siliguri',Arial,sans-serif;padding:24px;color:#111}
      h2{text-align:center;margin:0 0 6px}p{text-align:center;margin:0 0 18px;color:#555}
      table{width:100%;border-collapse:collapse;margin-bottom:18px}th,td{border:1px solid #999;padding:8px;text-align:left}
      th{background:#eee}.total{text-align:right;font-size:18px;font-weight:bold;margin-top:14px}
      .summary{text-align:center;margin:10px 0 18px;font-weight:600}
      @media print{button{display:none}}
    </style></head><body>
    <h2>${esc(title)}</h2><p>${esc(subtitle)}</p>
    <div class="summary">মোট এন্ট্রি: ${rows.length} &nbsp; | &nbsp; মোট বাকি: ${money(total)}</div>
    ${marketRows.length>1?`<h3>মার্কেট অনুযায়ী সারাংশ</h3><table><thead><tr><th>মার্কেট</th><th>এন্ট্রি সংখ্যা</th><th>মোট বাকি</th></tr></thead>
    <tbody>${marketRows.map(([m,g])=>`<tr><td>${esc(m)}</td><td>${g.count}</td><td>${money(g.total)}</td></tr>`).join('')}</tbody></table>`:''}
    <table><thead><tr><th>ক্রমিক</th><th>তারিখ</th><th>মার্কেট</th><th>দোকানদারের নাম</th><th>ঠিকানা</th><th>বাকি Amount</th><th>নোট</th></tr></thead>
    <tbody>${rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.date)}</td><td>${esc(x.market||'—')}</td><td>${esc(x.name)}</td><td>${esc(x.address||'—')}</td><td>${money(x.amount)}</td><td>${esc(x.note||'—')}</td></tr>`).join('')}</tbody></table>
    <div class="total">মোট বাকি: ${money(total)}</div><script>window.print()<\/script></body></html>`);
    w.document.close();
  }


  const dbPaymentBtn=document.getElementById('dbPaymentBtn');
  if(dbPaymentBtn) dbPaymentBtn.onclick=()=>{
    const d=filter?.value||todayStr();
    const m=marketFilterEl?.value||'';
    let rows=DB.dailyBakiList.filter(x=>String(x.date)===String(d));
    if(m) rows=rows.filter(x=>String(x.market||'')===m);
    if(!rows.length){alert('এই তারিখে কোনো বাকি নেই।');return;}
    const list=rows.map((x,i)=>`${i+1}. [${x.market||'—'}] ${x.name} — বর্তমান বাকি ${money(Math.max(0,Number(x.amount||0)-Number(x.paid||0)))}`).join('\n');
    const choice=prompt(`যার পেমেন্ট নেবেন তার ক্রমিক নম্বর লিখুন:\n\n${list}`);
    if(choice===null)return;
    const idx=Number(choice)-1;
    const item=rows[idx];
    if(!item){alert('সঠিক ক্রমিক নম্বর দিন।');return;}
    const due=Math.max(0,Number(item.amount||0)-Number(item.paid||0));
    if(due<=0){alert('এই বাকি সম্পূর্ণ পরিশোধ করা হয়েছে।');return;}
    const val=prompt(`${item.name}\nবর্তমান বাকি: ${money(due)}\nপরিশোধের টাকা লিখুন:`,String(due));
    if(val===null)return;
    const pay=Number(val);
    if(!Number.isFinite(pay)||pay<=0||pay>due){alert('সঠিক পেমেন্টের পরিমাণ দিন।');return;}
    item.paid=Number(item.paid||0)+pay;
    item.paymentStatus=item.paid>=Number(item.amount||0)?'paid':'partial';
    if(!Array.isArray(item.payments))item.payments=[];
    item.payments.push({id:uid('bp'),date:todayStr(),amount:pay});
    if(!Array.isArray(DB.cashbook))DB.cashbook=[];
    DB.cashbook.push({id:uid('cb'),date:todayStr(),type:'in',category:'baki_collection',categoryName:'বাকি আদায়',amount:pay,note:`বাকি আদায় — ${item.name}`,source:'daily_baki_payment',refId:item.id});
    saveDB();toast(`৳ ${pay.toFixed(2)} পেমেন্ট গ্রহণ করা হয়েছে`);render();
  };

  const directPrint=document.getElementById('dbPrintDirectBtn');
  if(directPrint) directPrint.onclick=()=>{
    const d=filter?.value||todayStr();
    const m=marketFilterEl?.value||'';
    let rows=DB.dailyBakiList.filter(x=>String(x.date)===String(d))
      .sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
    if(m) rows=rows.filter(x=>String(x.market||'')===m);
    openBakiPdfReport('দৈনিক বাকি লিস্ট',`তারিখ: ${d}${m?' | মার্কেট: '+m:''}`,rows);
  };

  const print=document.getElementById('dbPrintBtn');
  if(print) print.onclick=()=>{
    const d=filter?.value||todayStr();
    const m=marketFilterEl?.value||'';
    let rows=DB.dailyBakiList.filter(x=>String(x.date)===String(d))
      .sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
    if(m) rows=rows.filter(x=>String(x.market||'')===m);
    openBakiPdfReport('দৈনিক বাকি লিস্ট',`তারিখ: ${d}${m?' | মার্কেট: '+m:''}`,rows);
  };

  const monthlyPrint=document.getElementById('dbMonthlyPrintBtn');
  if(monthlyPrint) monthlyPrint.onclick=()=>{
    const d=filter?.value||todayStr();
    const m=marketFilterEl?.value||'';
    const ym=String(d).slice(0,7);
    let rows=DB.dailyBakiList.filter(x=>String(x.date||'').slice(0,7)===ym)
      .sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')) || String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
    if(m) rows=rows.filter(x=>String(x.market||'')===m);
    openBakiPdfReport('মাসিক বাকি লিস্ট',`মাস: ${ym}${m?' | মার্কেট: '+m:''}`,rows);
  };

  // ===== সব রিপোর্ট একসাথে প্যানেলের ৪টি PDF বাটন =====
  function rangeFor(d){
    const [ry,rm,rd]=String(d).split('-').map(Number);
    const base=new Date(ry,(rm||1)-1,rd||1);
    const dow=base.getDay();
    const ws=new Date(base); ws.setDate(base.getDate()-dow);
    const we=new Date(ws); we.setDate(ws.getDate()+6);
    const toYMD=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
    return {weekStart:toYMD(ws), weekEnd:toYMD(we), ym:String(d).slice(0,7), y:String(d).slice(0,4)};
  }
  const sortRows = r => r.slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')) || String(a.createdAt||'').localeCompare(String(b.createdAt||'')));

  const allDaily=document.getElementById('dbAllPrintDaily');
  if(allDaily) allDaily.onclick=()=>{
    const d=filter?.value||todayStr(); const m=marketFilterEl?.value||'';
    let rows=sortRows(DB.dailyBakiList.filter(x=>String(x.date)===String(d)));
    if(m) rows=rows.filter(x=>String(x.market||'')===m);
    openBakiPdfReport('দৈনিক বাকি লিস্ট',`তারিখ: ${d}${m?' | মার্কেট: '+m:''}`,rows);
  };
  const allWeekly=document.getElementById('dbAllPrintWeekly');
  if(allWeekly) allWeekly.onclick=()=>{
    const d=filter?.value||todayStr(); const m=marketFilterEl?.value||'';
    const {weekStart,weekEnd}=rangeFor(d);
    let rows=sortRows(DB.dailyBakiList.filter(x=>String(x.date||'')>=weekStart && String(x.date||'')<=weekEnd));
    if(m) rows=rows.filter(x=>String(x.market||'')===m);
    openBakiPdfReport('সাপ্তাহিক বাকি লিস্ট',`সপ্তাহ: ${weekStart} — ${weekEnd}${m?' | মার্কেট: '+m:''}`,rows);
  };
  const allMonthly=document.getElementById('dbAllPrintMonthly');
  if(allMonthly) allMonthly.onclick=()=>{
    const d=filter?.value||todayStr(); const m=marketFilterEl?.value||'';
    const {ym}=rangeFor(d);
    let rows=sortRows(DB.dailyBakiList.filter(x=>String(x.date||'').slice(0,7)===ym));
    if(m) rows=rows.filter(x=>String(x.market||'')===m);

  const rangeThisYearBtn=document.getElementById('dbRangeThisYear');

    const to=rangeToEl?.value||todayStr();

    if(m) rows=rows.filter(x=>String(x.market||'')===m);
    openBakiPdfReport('কাস্টম তারিখ রেঞ্জ বাকি লিস্ট',`তারিখ: ${from} — ${to}${m?' | মার্কেট: '+m:' | সকল মার্কেট একসাথে'}`,rows);

  return `

      <div class="filters">
        <select id="stkCompanyFilter">${companyOptions}</select>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;"><input type="checkbox" id="stkLowOnly"> শুধু Low Stock</label>
      </div>
    </div>
    <div class="panel-body table-wrap" id="stockTableWrap"></div>
  </div>`;

function afterStock(){
  const compFilter = document.getElementById('stkCompanyFilter');
  const lowOnly = document.getElementById('stkLowOnly');
  function draw(){
    let prods = DB.products;
    if(compFilter.value) prods = prods.filter(p=>p.companyId===compFilter.value);
    const rows = prods.map(p=>{
      let lifted=0, sold=0, returned=0;
      DB.liftings.forEach(l=> l.items.forEach(it=>{ if(it.productId===p.id) lifted+=Number(it.qty); }));
      DB.sales.forEach(s=> s.items.forEach(it=>{ if(it.productId===p.id) sold+=Number(it.qty); }));
      DB.salesReturns.forEach(r=> r.items.forEach(it=>{ if(it.productId===p.id) returned+=Number(it.qty); }));
      const opening = Number(p.openingStock||0);
      const closing = opening + lifted - sold + returned;
      const low = closing <= Number(p.minStock||0);
      return {p, opening, lifted, sold, returned, closing, low};
    }).filter(r=> lowOnly.checked ? r.low : true);

    const wrap = document.getElementById('stockTableWrap');
    if(!rows.length){ wrap.innerHTML = `<div class="empty">কোনো তথ্য নেই।</div>`; return; }
    wrap.innerHTML = `<table><thead><tr>
      <th>কোম্পানি</th><th>Product</th><th>Opening</th><th>Lifting</th><th>Sales</th><th>Return</th><th>Damage</th><th>Closing</th><th>Stock Value</th><th>স্ট্যাটাস</th>
    </tr></thead><tbody>${rows.map(r=>`<tr>
      <td>${esc(companyName(r.p.companyId))}</td><td>${esc(r.p.name)}</td>
      <td>${fmt(r.opening)}</td><td>${fmt(r.lifted)}</td><td>${fmt(r.sold)}</td><td>${fmt(r.returned)}</td><td>${fmt(r.damaged)}</td>
      <td><b>${fmt(r.closing)}</b></td><td>${money(r.closing * Number(r.p.purchasePrice||0))}</td>
      <td>${r.low? '<span class="tag low">Low Stock</span>' : '<span class="tag ok">Normal</span>'}</td>
    </tr>`).join('')}</tbody></table>
    <div class="cart-total" style="text-align:right;margin-top:12px;">Total Stock Value: ${money(rows.reduce((s,r)=>s+r.closing*Number(r.p.purchasePrice||0),0))}</div>`;
  }
  compFilter.addEventListener('change', draw);
  lowOnly.addEventListener('change', draw);
  draw();
}

function afterDamage(){
  DB.damages=DB.damages||[];
  let cart=[];

  const invoiceInput=document.getElementById('damageInvoiceNo');
  const product=document.getElementById('damageProduct');
  const company=document.getElementById('damageCompany');
  const qty=document.getElementById('damageQty');
  const rate=document.getElementById('damageRate');
  const value=document.getElementById('damageValue');
  const cartArea=document.getElementById('damageCart');

  function sale(){return DB.sales.find(x=>x.id===invoiceInput.value);}
  function loadInvoicesByDate(){
    const selectedDate=document.getElementById('damageInvoiceDate').value;
    const filtered=(DB.sales||[]).filter(x=>String(x.date||'')===selectedDate);
    invoiceInput.innerHTML='<option value="">— এই তারিখের Invoice নির্বাচন করুন —</option>'+
      filtered.map(x=>`<option value="${x.id}">${esc(x.invoiceNo)} — ${esc(x.customerName||'Customer')} — Total: ${money(x.total||0)}</option>`).join('');
    loadProducts();
  }
  function loadProducts(){
    const s=sale();
    const products=DB.products||[];
    product.innerHTML='<option value="">Product নির্বাচন করুন</option>'+products.map(p=>{
      const co=(DB.companies||[]).find(c=>c.id===p.companyId);
      return `<option value="${p.id}">${esc(co?.name||'কোম্পানি নেই')} — ${esc(p.name)}${p.code?' — '+esc(p.code):''}</option>`;
    }).join('');
    if(s && s.companyId) company.value=s.companyId;
  }
  function calc(){value.value=(Number(qty.value||0)*Number(rate.value||0)).toFixed(2);}
  function renderCart(){
    cartArea.innerHTML=cart.length?`<table><thead><tr><th>Product</th><th>Qty</th><th>Rate</th><th>Value</th><th>Action</th></tr></thead><tbody>
      ${cart.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${fmt(x.qty)}</td><td>${money(x.rate)}</td><td>${money(x.amount)}</td><td><button type="button" class="btn small danger" data-damage-cart-del="${i}">Delete</button></td></tr>`).join('')}
      </tbody></table><div class="cart-total">Total Damage Value: ${money(cart.reduce((a,x)=>a+x.amount,0))}</div>`:
      '<div class="empty">কোনো Product যোগ করা হয়নি।</div>';
    cartArea.querySelectorAll('[data-damage-cart-del]').forEach(b=>b.onclick=()=>{cart.splice(Number(b.dataset.damageCartDel),1);renderCart();});
  }

  document.getElementById('damageInvoiceDate').addEventListener('change',loadInvoicesByDate);
  invoiceInput.addEventListener('change',loadProducts);
  qty.addEventListener('input',calc); rate.addEventListener('input',calc);

  document.getElementById('damageAddProduct').onclick=()=>{
    const s=sale(), p=DB.products.find(x=>x.id===product.value), q=Number(qty.value), r=Number(rate.value);
    if(!s){alert('সঠিক Invoice Number দিন।');return;}
    if(!p||!q||q<=0||r<0){alert('Product, Quantity ও Rate সঠিকভাবে দিন।');return;}
    cart.push({productId:p.id,companyId:company.value||p.companyId,name:p.name,qty:q,rate:r,amount:q*r,reason:document.getElementById('damageReason').value.trim()});
    product.value='';qty.value='';rate.value='';value.value='';document.getElementById('damageReason').value='';
    renderCart();
  };

  document.getElementById('damageForm').onsubmit=e=>{
    e.preventDefault();
    const s=sale();
    if(!s){alert('সঠিক Invoice Number দিন।');return;}
    if(!cart.length){alert('কমপক্ষে একটি Damage Product যোগ করুন।');return;}
    const damageTotal=cart.reduce((a,x)=>a+x.amount,0), oldTotal=Number(s.total||0);
    if(damageTotal>oldTotal){alert('মোট Damage Value Invoice-এর বর্তমান Total-এর চেয়ে বেশি হতে পারবে না।');return;}
    const newTotal=Math.max(oldTotal-damageTotal,0);
    cart.forEach(x=>DB.damages.push({
      id:uid('damage'),date:document.getElementById('damageDate').value||todayStr(),salesId:s.id,invoiceNo:s.invoiceNo,
      companyId:x.companyId||s.companyId,productId:x.productId,qty:x.qty,rate:x.rate,purchasePrice:Number(productById(x.productId)?.purchasePrice||0),total:x.amount,reason:x.reason,
      oldInvoiceTotal:oldTotal,newInvoiceTotal:newTotal
    }));
    s.total=newTotal;s.baki=Math.max(newTotal-Number(s.paid||0),0);s.damageAmount=Number(s.damageAmount||0)+damageTotal;
    // Invoice total already reduced by the full damage sale value above.
    // Profit should only lose the profit portion of the damaged items (rate - purchase price),
    // not their full sale value, otherwise Net Profit drops far more than it should.
    recalcSale(s);
    saveDB();toast(`Invoice ${s.invoiceNo}-এর ${money(damageTotal)} Damage বাদ হয়েছে`);render();
  };

  function editDamage(id){
    const d=DB.damages.find(x=>x.id===id);if(!d)return;
    const newQty=prompt('Damage Quantity লিখুন:',String(d.qty));if(newQty===null)return;
    const q=Number(newQty);if(!q||q<=0){alert('Quantity সঠিক নয়।');return;}
    const newRate=prompt('Damage Rate লিখুন:',String(d.rate));if(newRate===null)return;
    const r=Number(newRate);if(r<0||Number.isNaN(r)){alert('Rate সঠিক নয়।');return;}
    const newReason=prompt('কারণ / বিবরণ লিখুন:',d.reason||'');if(newReason===null)return;
    const oldAmount=Number(d.total||0),newAmount=q*r,diff=newAmount-oldAmount;
    const s=DB.sales.find(x=>x.id===d.salesId);
    if(!s){alert('এই Damage-এর Sales Invoice পাওয়া যায়নি।');return;}
    d.qty=q;d.rate=r;d.total=newAmount;d.reason=newReason;
    recalcSale(s);
    DB.damages.filter(x=>x.salesId===s.id).forEach(x=>x.newInvoiceTotal=s.total);
    saveDB();toast('Damage Entry সফলভাবে Edit হয়েছে।');draw();
  }

  function deleteDamage(id){
    const idx=DB.damages.findIndex(x=>x.id===id);if(idx<0)return;
    const d=DB.damages[idx];
    if(!confirm(`এই Damage Entry (${money(d.total)}) Delete করবেন?`))return;
    const s=DB.sales.find(x=>x.id===d.salesId);
    DB.damages.splice(idx,1);
    if(s){recalcSale(s);DB.damages.filter(x=>x.salesId===s.id).forEach(x=>x.newInvoiceTotal=s.total);}
    saveDB();toast('Damage Entry Delete হয়েছে এবং Invoice Value পুনরায় সমন্বয় হয়েছে।');draw();
  }

  function dates(){
    const today=todayStr(),p=document.getElementById('damagePreset').value;
    if(p==='all')return['0000-01-01','9999-12-31'];
    if(p==='daily')return[today,today];
    if(p==='monthly')return[today.slice(0,7)+'-01',today];
    if(p==='yearly')return[today.slice(0,4)+'-01-01',today];
    if(p==='weekly'){const d=new Date(),day=d.getDay()||7;d.setDate(d.getDate()-day+1);return[d.toISOString().slice(0,10),today];}
    return[document.getElementById('damageFrom').value||'0000-01-01',document.getElementById('damageTo').value||today];
  }
  function filteredRows(){
    const [from,to]=dates();let rows=DB.damages.filter(d=>String(d.date||'')>=from&&String(d.date||'')<=to);
    const cf=document.getElementById('damageFilterCompany').value;if(cf)rows=rows.filter(d=>d.companyId===cf);
    return rows.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  }
  function draw(){
    const rows=filteredRows();
    const q=rows.reduce((a,d)=>a+Number(d.qty||0),0),v=rows.reduce((a,d)=>a+Number(d.total||0),0);
    const groups={};
    rows.forEach(d=>{const k=d.companyId||'none';if(!groups[k])groups[k]={name:companyName(k),qty:0,value:0,count:0};groups[k].qty+=Number(d.qty||0);groups[k].value+=Number(d.total||0);groups[k].count++;});
    const companySummary=Object.values(groups).sort((a,b)=>b.value-a.value);
    document.getElementById('damageSummary').innerHTML=`<div class="stat-card"><div class="lbl">Damage Entry</div><div class="val">${rows.length}</div></div><div class="stat-card"><div class="lbl">মোট Damage Qty</div><div class="val">${fmt(q)}</div></div><div class="stat-card red"><div class="lbl">মোট Damage Value</div><div class="val">${money(v)}</div></div>`;
    const summaryHtml=companySummary.length?`<div style="margin:15px 0"><h4>🏢 কোম্পানি অনুযায়ী মোট Damage</h4><table><thead><tr><th>Company</th><th>Damage Entry</th><th>Total Qty</th><th>Total Damage Value</th></tr></thead><tbody>${companySummary.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.count}</td><td>${fmt(x.qty)}</td><td><b>${money(x.value)}</b></td></tr>`).join('')}</tbody></table></div>`:'';
    const detail=rows.length?`<table><thead><tr><th>Damage Date</th><th>Invoice Date</th><th>Invoice</th><th>Company</th><th>Product</th><th>Qty</th><th>Rate</th><th>Damage Value</th><th>Invoice Total After Damage</th><th>কারণ</th><th>Action</th></tr></thead><tbody>${rows.map(d=>{
      const sale=DB.sales.find(s=>s.id===d.salesId);
      return `<tr><td>${esc(d.date||'—')}</td><td>${esc(sale?.date||'—')}</td><td>${esc(d.invoiceNo||'—')}</td><td>${esc(companyName(d.companyId))}</td><td>${esc(productById(d.productId)?.name||'—')}</td><td>${fmt(d.qty)}</td><td>${money(d.rate)}</td><td>${money(d.total)}</td><td>${money(d.newInvoiceTotal??sale?.total??0)}</td><td>${esc(d.reason||'—')}</td><td>${isAdmin()?`<button type="button" class="btn small" data-damage-edit="${d.id}">✏️ Edit</button> <button type="button" class="btn small danger" data-damage-delete="${d.id}">🗑️ Delete</button>`:''}</td></tr>`;
    }).join('')}</tbody></table>`:'<div class="empty">এই সময়ের কোনো Damage Entry নেই।</div>';
    document.getElementById('damageReportTable').innerHTML=summaryHtml+detail;
    document.querySelectorAll('[data-damage-edit]').forEach(b=>b.onclick=()=>editDamage(b.dataset.damageEdit));
    document.querySelectorAll('[data-damage-delete]').forEach(b=>b.onclick=()=>deleteDamage(b.dataset.damageDelete));
  }
  ['damagePreset','damageFrom','damageTo','damageFilterCompany'].forEach(id=>document.getElementById(id).addEventListener('change',draw));

  function printDamageReport(){
    const [from,to]=dates(),cf=document.getElementById('damageFilterCompany').value,rows=filteredRows();
    const qtyTotal=rows.reduce((s,d)=>s+Number(d.qty||0),0),value=rows.reduce((s,d)=>s+Number(d.total||0),0),groups={};

    <h3>কোম্পানি অনুযায়ী মোট Damage</h3><table><thead><tr><th>Company</th><th>Damage Entry</th><th>Total Qty</th><th>Total Damage Value</th></tr></thead><tbody>${Object.values(groups).sort((a,b)=>b.value-a.value).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.count}</td><td>${fmt(x.qty)}</td><td>${money(x.value)}</td></tr>`).join('')}</tbody></table>

    w.document.close();
  }
  document.getElementById('damagePrint').onclick=printDamageReport;document.getElementById('damagePDF').onclick=printDamageReport;
  renderCart();draw();loadInvoicesByDate();
}

let cashbookEditId = null;

function editCashbook(id){
  const row = DB.cashbook.find(r=>r.id===id);
  if(!row) return;
  cashbookEditId = id;
  navigate('cashbook');
}

  cashbookEditId = null;
  render();

function deleteCashbook(id){
  const row = DB.cashbook.find(r=>r.id===id);
  if(!row) return;
  const label = `${row.date} — ${row.categoryName||'অন্যান্য'} — ${money(row.amount)}`;
  if(!confirm(`এই Cashbook এন্ট্রিটি মুছে ফেলবেন?\n${label}`)) return;
  DB.cashbook = DB.cashbook.filter(r=>r.id!==id);
  saveDB();
  toast('Cashbook Entry মুছে ফেলা হয়েছে');
  render();
}

function afterCashbook(){
  const typeEl=document.getElementById('cbType');
  const catEl=document.getElementById('cbCategory');
  const categories={
    in:[['capital','অতিরিক্ত মূলধন জমা'],['other_in','অন্যান্য জমা']],
    out:[['office','অফিস খরচ'],['home','বাড়ির খরচ'],['house','বাসার খরচ'],['entertainment','আপ্যায়ন'],['social','সমাজসেবা'],['other_out','অন্যান্য']]
  };
  const editRow = cashbookEditId ? DB.cashbook.find(r=>r.id===cashbookEditId) : null;

  function loadCategories(selected){
    catEl.innerHTML=categories[typeEl.value].map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');
    if(selected && categories[typeEl.value].some(x=>x[0]===selected)) catEl.value=selected;
  }
  typeEl.value = editRow?.type || 'in';
  loadCategories(editRow?.category);
  typeEl.addEventListener('change',()=>loadCategories());

  document.getElementById('cbForm').addEventListener('submit', e=>{
    e.preventDefault();
    const type=typeEl.value, amount=Number(document.getElementById('cbAmount').value);
    if(!amount || amount<=0){ toast('সঠিক পরিমাণ দিন'); return; }
    const cat=catEl.value;
    const catName=categories[type].find(x=>x[0]===cat)?.[1]||'অন্যান্য';
    const data={
      date:document.getElementById('cbDate').value||todayStr(),
      type, category:cat, categoryName:catName, amount,
      note:document.getElementById('cbNote').value.trim()
    };
    if(cashbookEditId){
      const idx=DB.cashbook.findIndex(r=>r.id===cashbookEditId);
      if(idx>=0) DB.cashbook[idx]={...DB.cashbook[idx],...data};
      cashbookEditId=null;
      saveDB(); toast('Cashbook Entry আপডেট হয়েছে'); render();
    }else{
      DB.cashbook.push({id:uid('cb'),...data,source:'manual'});
      saveDB(); toast('Cashbook Entry যুক্ত হয়েছে'); render();
    }
  });

  // Non-admin users get the restricted "শুধু জমা/খরচ" form (see renderCashbook), which has
  // none of the report/ledger/PDF DOM elements below — so skip all of that for them.
  if(!isAdmin()) return;

  const from=document.getElementById('cbFrom'),to=document.getElementById('cbTo'),preset=document.getElementById('cbPreset');
  function setPreset(){
    const d=new Date(); let f=new Date(d), t=new Date(d);
    if(preset.value==='weekly'){ const day=d.getDay(); f.setDate(d.getDate()-(day===0?6:day-1)); }
    else if(preset.value==='monthly'){ f=new Date(d.getFullYear(),d.getMonth(),1); }
    else if(preset.value==='yearly'){ f=new Date(d.getFullYear(),0,1); }
    else if(preset.value==='custom') return;
    from.value=f.toISOString().slice(0,10); to.value=t.toISOString().slice(0,10); draw();
  }
  function draw(){
    let rows=[...DB.cashbook].map(r=>({...r,categoryName:r.categoryName|| (r.type==='in'?'অন্যান্য জমা':'অন্যান্য')})).sort((a,b)=>b.date.localeCompare(a.date));
    if(from.value) rows=rows.filter(r=>r.date>=from.value);
    if(to.value) rows=rows.filter(r=>r.date<=to.value);
    const totalIn=rows.filter(r=>r.type==='in').reduce((s,r)=>s+Number(r.amount||0),0);
    const totalOut=rows.filter(r=>r.type==='out').reduce((s,r)=>s+Number(r.amount||0),0);
    document.getElementById('cbSummary').innerHTML=`
      <div class="stat-card green"><div class="lbl">মোট জমা</div><div class="val">${money(totalIn)}</div></div>
      <div class="stat-card red"><div class="lbl">মোট খরচ</div><div class="val">${money(totalOut)}</div></div>
      <div class="stat-card"><div class="lbl">নিট ব্যালেন্স</div><div class="val">${money(totalIn-totalOut)}</div></div>`;
    const groups={};
    rows.forEach(r=>{const key=(r.type==='in'?'জমা: ':'খরচ: ')+r.categoryName; if(!groups[key]) groups[key]={type:r.type,name:r.categoryName,total:0,count:0}; groups[key].total+=Number(r.amount||0); groups[key].count++;});
    const order=[...Object.values(groups)].sort((a,b)=>a.type.localeCompare(b.type)||b.total-a.total);
    document.getElementById('cbCategorySummary').innerHTML=`
      <h4 style="margin:0 0 10px;">জমা ও খরচ — ক্যাটাগরি অনুযায়ী</h4>
      ${order.length?`<div class="table-wrap"><table><thead><tr><th>ধরন</th><th>ক্যাটাগরি</th><th>এন্ট্রি</th><th>মোট টাকা</th></tr></thead><tbody>${order.map(g=>`<tr><td>${g.type==='in'?'<span class="tag paid">জমা</span>':'<span class="tag due">খরচ</span>'}</td><td>${esc(g.name)}</td><td>${g.count}</td><td>${money(g.total)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">এই সময়ের কোনো জমা/খরচ নেই।</div>'}`;
    const wrap=document.getElementById('cbTableWrap');
    wrap.innerHTML=rows.length?`<table><thead><tr><th>তারিখ</th><th>ধরন</th><th>ক্যাটাগরি</th><th>পরিমাণ</th><th>বিবরণ</th><th>অ্যাকশন</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.date}</td><td>${r.type==='in'?'<span class="tag paid">জমা</span>':'<span class="tag due">খরচ</span>'}</td><td>${esc(r.categoryName)}</td><td>${money(r.amount)}</td><td>${esc(r.note||'—')}</td><td style="white-space:nowrap;"><button type="button" class="btn" onclick="editCashbook('${r.id}')" title="Edit">✏️ এডিট</button> <button type="button" class="btn" onclick="deleteCashbook('${r.id}')" title="Delete">🗑️ ডিলিট</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">কোনো এন্ট্রি নেই।</div>';
  }
  function getFilteredCashbookRows(){
    let rows=[...DB.cashbook].map(r=>({...r,categoryName:r.categoryName|| (r.type==='in'?'অন্যান্য জমা':'অন্যান্য')}))
      .sort((a,b)=>b.date.localeCompare(a.date));
    if(from.value) rows=rows.filter(r=>r.date>=from.value);
    if(to.value) rows=rows.filter(r=>r.date<=to.value);
    return rows;
  }

  function openCashbookPdf(title, rows, modeLabel){
    const totalIn=rows.filter(r=>r.type==='in').reduce((s,r)=>s+Number(r.amount||0),0);
    const totalOut=rows.filter(r=>r.type==='out').reduce((s,r)=>s+Number(r.amount||0),0);
    const groups={};
    rows.forEach(r=>{
      const key=(r.type==='in'?'জমা: ':'খরচ: ')+r.categoryName;
      if(!groups[key]) groups[key]={type:r.type,name:r.categoryName,total:0,count:0};
      groups[key].total+=Number(r.amount||0); groups[key].count++;
    });
    const summary=[...Object.values(groups)].sort((a,b)=>a.type.localeCompare(b.type)||b.total-a.total);

    const w=window.open('','_blank'); if(!w)return;
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title>
    <style>
      body{font-family:'Noto Sans Bengali','Hind Siliguri',Arial,sans-serif;padding:24px;color:#111}
      h2{text-align:center;margin:0 0 6px}p{text-align:center;margin:0 0 18px;color:#555}
      .cards{display:flex;gap:12px;justify-content:center;margin:12px 0 20px;flex-wrap:wrap}
      .card{border:1px solid #aaa;padding:10px 18px;text-align:center;min-width:150px}
      .label{font-size:12px;color:#555}.value{font-size:18px;font-weight:bold}
      table{width:100%;border-collapse:collapse;margin-top:10px}
      th,td{border:1px solid #999;padding:7px;text-align:left}th{background:#eee}
      h3{margin:22px 0 8px}.right{text-align:right}
      @media print{button{display:none}}
    </style></head><body>
    <h2>${esc(title)}</h2><p>${esc(modeLabel)}</p>
    <div class="cards">
      <div class="card"><div class="label">মোট জমা</div><div class="value">${money(totalIn)}</div></div>
      <div class="card"><div class="label">মোট খরচ</div><div class="value">${money(totalOut)}</div></div>
      <div class="card"><div class="label">নিট ব্যালেন্স</div><div class="value">${money(totalIn-totalOut)}</div></div>
    </div>
    <h3>ক্যাটাগরি অনুযায়ী সারসংক্ষেপ</h3>
    <table><thead><tr><th>ধরন</th><th>ক্যাটাগরি</th><th>এন্ট্রি</th><th>মোট টাকা</th></tr></thead>
    <tbody>${summary.map(g=>`<tr><td>${g.type==='in'?'জমা':'খরচ'}</td><td>${esc(g.name)}</td><td>${g.count}</td><td>${money(g.total)}</td></tr>`).join('')}</tbody></table>
    <h3>বিস্তারিত লেনদেন</h3>
    <table><thead><tr><th>ক্রমিক</th><th>তারিখ</th><th>ধরন</th><th>ক্যাটাগরি</th><th>পরিমাণ</th><th>বিবরণ</th></tr></thead>
    <tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.date)}</td><td>${r.type==='in'?'জমা':'খরচ'}</td><td>${esc(r.categoryName)}</td><td>${money(r.amount)}</td><td>${esc(r.note||'—')}</td></tr>`).join('')}</tbody></table>
    <script>window.print()<\/script></body></html>`);
    w.document.close();
  }

  function cashbookPdf(type){
    let rows=getFilteredCashbookRows();
    const range=(from.value||todayStr()) + ' থেকে ' + (to.value||todayStr());
    if(type==='in') rows=rows.filter(r=>r.type==='in');
    if(type==='out') rows=rows.filter(r=>r.type==='out');
    const title=type==='in'?'ক্যাশবুক — জমা খাতভিত্তিক রিপোর্ট':type==='out'?'ক্যাশবুক — খরচ খাতভিত্তিক রিপোর্ট':'ডেইলি ক্যাশবুক — পূর্ণ রিপোর্ট';
    openCashbookPdf(title,rows,`রিপোর্টের সময়কাল: ${range}`);
  }

  document.getElementById('cbPdfAll').onclick=()=>cashbookPdf('all');
  document.getElementById('cbPdfIn').onclick=()=>cashbookPdf('in');
  document.getElementById('cbPdfOut').onclick=()=>cashbookPdf('out');

  preset.addEventListener('change',setPreset); from.addEventListener('change',()=>{preset.value='custom';draw();}); to.addEventListener('change',()=>{preset.value='custom';draw();});
  setPreset();

  // Separate reports: Supplier Payment by company + every Cashbook expense category
  const sType=document.getElementById('cbSpecialType');
  const sPreset=document.getElementById('cbSpecialPreset');
  const sFrom=document.getElementById('cbSpecialFrom');
  const sTo=document.getElementById('cbSpecialTo');
  const sCompany=document.getElementById('cbSpecialCompany');
  const sPdf=document.getElementById('cbSpecialPdf');

  const specialLabels={
    office:'অফিস খরচ', home:'বাসার খরচ', house:'বাড়ির খরচ',
    entertainment:'আপ্যায়ন', social:'সমাজসেবা', other_out:'অন্যান্য খরচ'
  };

  function supplierCompanyName(p){
    const c=(DB.companies||[]).find(function(x){ return String(x.id)===String(p.companyId); });
    return c ? c.name : (p.company || p.companyName || 'অজানা কোম্পানি');
  }

  function isoDate(d){
    return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  }

  function setSpecialDates(){
    if(sPreset.value==='custom') return;
    const d=new Date();
    let f=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    if(sPreset.value==='monthly') f=new Date(d.getFullYear(),d.getMonth(),1);
    if(sPreset.value==='yearly') f=new Date(d.getFullYear(),0,1);
    sFrom.value=isoDate(f);
    sTo.value=isoDate(d);
    drawSpecial();
  }

  function expenseMatches(r,type){
    if(r.type!=='out') return false;
    const cat=String(r.category||'').toLowerCase();
    const name=String(r.categoryName||'').toLowerCase();
    if(type==='office') return cat==='office' || name.indexOf('অফিস')>=0 || name.indexOf('office')>=0;
    if(type==='home') return cat==='home' || name.indexOf('বাসা')>=0 || name.indexOf('বাড়ি')>=0 || name.indexOf('বাড়ি')>=0;
    if(type==='house') return cat==='house';
    if(type==='entertainment') return cat==='entertainment' || name.indexOf('আপ্যায়ন')>=0 || name.indexOf('আপ্যায়ন')>=0;
    if(type==='social') return cat==='social' || name.indexOf('সমাজসেবা')>=0;
    if(type==='other_out') return cat==='other_out' || name.indexOf('অন্যান্য')>=0;
    return false;
  }

  function getSpecialRows(){
    const from=sFrom.value, to=sTo.value, type=sType.value;
    if(type==='supplier'){
      return (DB.supplierPayments||[]).filter(function(p){
        return (!from || String(p.date)>=from) && (!to || String(p.date)<=to) &&
          (!sCompany.value || String(p.companyId)===String(sCompany.value));
      }).map(function(p){
        return {id:p.id,date:p.date,company:supplierCompanyName(p),companyId:p.companyId,amount:Number(p.amount||0),note:p.note||'Supplier Payment'};
      });
    }
    return (DB.cashbook||[]).filter(function(r){
      return (!from || String(r.date)>=from) && (!to || String(r.date)<=to) && expenseMatches(r,type);
    }).map(function(r){
      return {id:r.id,date:r.date,company:specialLabels[type]||'খরচ',companyId:'',amount:Number(r.amount||0),note:r.note||''};
    });
  }

  function drawSpecial(){
    const type=sType.value;
    sCompany.style.display=type==='supplier' ? 'inline-block' : 'none';
    const rows=getSpecialRows().sort(function(a,b){return String(a.date).localeCompare(String(b.date));});
    const total=rows.reduce(function(sum,r){return sum+Number(r.amount||0);},0);
    const label=type==='supplier'?'Supplier Payment':(specialLabels[type]||'খরচ');
    document.getElementById('cbSpecialSummary').innerHTML=
      '<div class="stat-card"><div class="lbl">রিপোর্টের খাত</div><div class="val" style="font-size:18px">'+esc(label)+'</div></div>'+
      '<div class="stat-card red"><div class="lbl">মোট টাকা</div><div class="val">'+money(total)+'</div></div>'+
      '<div class="stat-card"><div class="lbl">মোট এন্ট্রি</div><div class="val">'+rows.length+'</div></div>';

    if(type==='supplier'){
      const groups={};
      rows.forEach(function(r){ const k=String(r.companyId||r.company); if(!groups[k]) groups[k]={name:r.company,total:0,count:0}; groups[k].total+=r.amount; groups[k].count++; });
      const gs=Object.values(groups).sort(function(a,b){return b.total-a.total;});
      document.getElementById('cbSpecialCompanySummary').innerHTML=gs.length?
        '<h4 style="margin:0 0 10px">কোম্পানি অনুযায়ী Supplier Payment</h4><table><thead><tr><th>কোম্পানি</th><th>Payment সংখ্যা</th><th>মোট Payment</th></tr></thead><tbody>'+
        gs.map(function(g){return '<tr><td>'+esc(g.name)+'</td><td>'+g.count+'</td><td>'+money(g.total)+'</td></tr>';}).join('')+'</tbody></table>':'<div class="empty">এই সময়ে কোনো Supplier Payment নেই।</div>';
    } else {
      document.getElementById('cbSpecialCompanySummary').innerHTML='';
    }

    document.getElementById('cbSpecialTable').innerHTML=rows.length?
      '<table><thead><tr><th>তারিখ</th><th>'+(type==='supplier'?'কোম্পানি':'খাত')+'</th><th>পরিমাণ</th><th>বিবরণ</th></tr></thead><tbody>'+
      rows.map(function(r){return '<tr><td>'+esc(r.date)+'</td><td>'+esc(r.company)+'</td><td>'+money(r.amount)+'</td><td>'+esc(r.note||'—')+'</td></tr>';}).join('')+
      '</tbody><tfoot><tr><th colspan="2">মোট</th><th>'+money(total)+'</th><th></th></tr></tfoot></table>':'<div class="empty">এই সময়ের মধ্যে কোনো হিসাব পাওয়া যায়নি।</div>';
  }

  if(sCompany){
    sCompany.innerHTML='<option value="">সব কোম্পানি</option>'+(DB.companies||[]).map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>';}).join('');
  }
  sType.onchange=drawSpecial;
  sCompany.onchange=drawSpecial;
  sPreset.onchange=function(){ if(sPreset.value!=='custom') setSpecialDates(); };
  sFrom.onchange=function(){sPreset.value='custom';drawSpecial();};
  sTo.onchange=function(){sPreset.value='custom';drawSpecial();};
  sPdf.onclick=function(){
    const rows=getSpecialRows().sort(function(a,b){return String(a.date).localeCompare(String(b.date));});
    const total=rows.reduce(function(sum,r){return sum+Number(r.amount||0);},0);
    const title=sType.value==='supplier'?'Supplier Payment রিপোর্ট':(specialLabels[sType.value]||'খরচ')+' রিপোর্ট';
    const company=sType.value==='supplier'&&sCompany.value ? sCompany.options[sCompany.selectedIndex].text : '';
    const w=window.open('','_blank');
    if(!w){alert('PDF রিপোর্ট খুলতে Popup অনুমতি দিন।');return;}
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>body{font-family:Arial,sans-serif;padding:24px;color:#111}h2{text-align:center}p{text-align:center;color:#555}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{border:1px solid #999;padding:8px;text-align:left}th{background:#eee}.total{text-align:right;font-size:18px;font-weight:bold;margin-top:14px}@media print{button{display:none}}</style></head><body><h2>S R Trading — '+esc(title)+'</h2><p>Nababbari chowmini, Addarsha cumilla.</p><p>তারিখ: '+esc(sFrom.value||'—')+' থেকে '+esc(sTo.value||'—')+(company?' | কোম্পানি: '+esc(company):'')+'</p><table><thead><tr><th>ক্রমিক</th><th>তারিখ</th><th>'+(sType.value==='supplier'?'কোম্পানি':'খাত')+'</th><th>পরিমাণ</th><th>বিবরণ</th></tr></thead><tbody>'+rows.map(function(r,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(r.date)+'</td><td>'+esc(r.company)+'</td><td>'+money(r.amount)+'</td><td>'+esc(r.note||'—')+'</td></tr>';}).join('')+'</tbody></table><div class="total">মোট: '+money(total)+'</div><script>window.onload=function(){window.print()}<\/script></body></html>');
    w.document.close();
  };

  setSpecialDates();

}

function afterReports(){
  const preset = document.getElementById('rpPreset');
  const from = document.getElementById('rpFrom'), to = document.getElementById('rpTo');
  const compSel = document.getElementById('rpCompany');
  const areaSel = document.getElementById('rpArea');
  const custSel = document.getElementById('rpCustomer');

  function refreshCustomerFilterOptions(){
    const areaId = areaSel.value;
    const custs = DB.customers.filter(c=>!areaId || c.areaId===areaId).slice().sort((a,b)=>a.name.localeCompare(b.name,'bn'));
    custSel.innerHTML = `<option value="">সব Customer</option>` + custs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  }
  refreshCustomerFilterOptions();

  function setPresetDates(){
    const now = new Date();
    let f = new Date(now), t = new Date(now);
    if(preset.value==='daily'){ /* today */ }
    else if(preset.value==='weekly'){ f.setDate(now.getDate() - now.getDay()); }
    else if(preset.value==='monthly'){ f = new Date(now.getFullYear(), now.getMonth(), 1); }
    else if(preset.value==='yearly'){ f = new Date(now.getFullYear(), 0, 1); }
    else { return; }
    from.value = f.toISOString().slice(0,10);
    to.value = t.toISOString().slice(0,10);
  }
  preset.addEventListener('change', ()=>{ setPresetDates(); draw(); });
  setPresetDates();

  function draw(){
    // Always refresh saved invoice calculations before any report is rendered.
    (DB.sales||[]).forEach(recalcSale);
    saveDB();
    let rows = DB.sales;
    if(from.value) rows = rows.filter(s=>s.date >= from.value);
    if(to.value) rows = rows.filter(s=>s.date <= to.value);
    if(compSel.value) rows = rows.filter(s=>(s.companyIds||[s.companyId]).includes(compSel.value));
    if(areaSel.value) rows = rows.filter(s=>s.areaId===areaSel.value);
    if(custSel.value) rows = rows.filter(s=>s.customerId===custSel.value);
    const totalSales = rows.reduce((s,r)=>s+Number(r.total||0),0);
    const totalPaid = rows.reduce((s,r)=>s+Number(r.paid||0),0);
    const totalBaki = rows.reduce((s,r)=>s+Number(r.baki||0),0);
    const totalDiscount = rows.reduce((s,r)=>s+Number(r.discountAmount||0),0);
    const totalGrossProfit = rows.reduce((s,r)=>s+Number(r.grossProfit||0),0);
    const totalCommission = rows.reduce((s,r)=>s+Number(r.commission||0),0);
    const totalNetProfit = rows.reduce((s,r)=>s+Number(r.netProfit ?? (Number(r.grossProfit||0)-Number(r.commission||0)),0),0);
    const overallMargin = totalSales ? (totalNetProfit/totalSales*100) : 0;
    document.getElementById('rpSummary').innerHTML = `
      <div class="stat-card"><div class="lbl">মোট Invoice</div><div class="val">${rows.length}</div></div>
      <div class="stat-card green"><div class="lbl">মোট বিক্রি</div><div class="val">${money(totalSales)}</div></div>
      <div class="stat-card"><div class="lbl">মোট Paid</div><div class="val">${money(totalPaid)}</div></div>
      <div class="stat-card red"><div class="lbl">মোট Baki</div><div class="val">${money(totalBaki)}</div></div>
      <div class="stat-card amber"><div class="lbl">মোট Discount</div><div class="val">${money(totalDiscount)}</div></div>
      <div class="stat-card green"><div class="lbl">Net Profit</div><div class="val">${money(totalNetProfit)}</div></div>`;

    document.getElementById('rpProfitSummary').innerHTML = `
      <div class="stat-card green"><div class="lbl">Gross Profit</div><div class="val">${money(totalGrossProfit)}</div></div>
      <div class="stat-card red"><div class="lbl">Commission</div><div class="val">${money(totalCommission)}</div></div>
      <div class="stat-card green"><div class="lbl">Net Profit</div><div class="val">${money(totalNetProfit)}</div></div>
      <div class="stat-card"><div class="lbl">Gross Profit Margin</div><div class="val">${totalSales ? (totalGrossProfit/totalSales*100).toFixed(2) : '0.00'}%</div></div>
      <div class="stat-card"><div class="lbl">Net Profit Margin</div><div class="val">${overallMargin.toFixed(2)}%</div></div>`;

    const periodMap = {};
    rows.forEach(r=>{
      const d = new Date(r.date+'T00:00:00');
      const key = preset.value==='yearly' ? r.date.slice(0,4) : r.date.slice(0,7);
      const label = preset.value==='daily' ? r.date : (preset.value==='yearly' ? r.date.slice(0,4) : r.date.slice(0,7));
      periodMap[key] ||= {label, sales:0, discount:0, gross:0, commission:0, net:0, count:0};
      const x=periodMap[key]; x.sales+=Number(r.total||0); x.discount+=Number(r.discountAmount||0); x.gross+=Number(r.grossProfit||0); x.commission+=Number(r.commission||0); x.net+=Number(r.netProfit ?? (Number(r.grossProfit||0)-Number(r.commission||0))); x.count++;
    });
    const profitRows=Object.values(periodMap).sort((a,b)=>a.label.localeCompare(b.label));
    document.getElementById('rpProfitTable').innerHTML = profitRows.length ? `<table><thead><tr><th>সময়কাল</th><th>Invoice</th><th>Sales</th><th>Discount</th><th>Gross Profit</th><th>Commission</th><th>Net Profit</th><th>Margin</th></tr></thead><tbody>${profitRows.map(x=>`<tr><td>${x.label}</td><td>${x.count}</td><td>${money(x.sales)}</td><td>${money(x.discount)}</td><td>${money(x.gross)}</td><td>${money(x.commission)}</td><td>${money(x.net)}</td><td>${x.sales?(x.net/x.sales*100).toFixed(2):'0.00'}%</td></tr>`).join('')}</tbody></table>` : `<div class="empty">এই পরিসীমায় Profit data নেই।</div>`;

    document.getElementById('rpDiscountSummary').innerHTML = `
      <div class="stat-card amber"><div class="lbl">মোট Discount</div><div class="val">${money(totalDiscount)}</div></div>
      <div class="stat-card"><div class="lbl">Discount দেওয়া Invoice</div><div class="val">${rows.filter(r=>Number(r.discountAmount||0)>0).length}</div></div>
      <div class="stat-card"><div class="lbl">Average Discount</div><div class="val">${money(rows.length?totalDiscount/rows.length:0)}</div></div>`;
    const discountRows=rows.filter(r=>Number(r.discountAmount||0)>0).sort((a,b)=>b.date.localeCompare(a.date));
    document.getElementById('rpDiscountTable').innerHTML = discountRows.length ? `<table><thead><tr><th>Invoice</th><th>তারিখ</th><th>Customer</th><th>Subtotal</th><th>Discount</th><th>Net Sales</th></tr></thead><tbody>${discountRows.map(r=>`<tr><td>${esc(r.invoiceNo)}</td><td>${r.date}</td><td>${esc(r.customerName)}</td><td>${money(r.subtotal||0)}</td><td>${money(r.discountAmount||0)}</td><td>${money(r.total||0)}</td></tr>`).join('')}</tbody></table>` : `<div class="empty">এই পরিসীমায় কোনো Discount নেই।</div>`;

    const byCompany = {};
    rows.forEach(r=>{
      const itemsByCompany = {};
      (r.items||[]).forEach(it=>{
        const cid = it.companyId || productById(it.productId)?.companyId || r.companyId;
        itemsByCompany[cid] = (itemsByCompany[cid]||0) + Number(it.amount||0);
      });
      Object.entries(itemsByCompany).forEach(([cid,total])=>{
        byCompany[cid] = byCompany[cid] || {total:0,count:0};
        byCompany[cid].total += total;
        byCompany[cid].count += 1;
      });
    });
    const compRows = Object.entries(byCompany).sort((a,b)=>b[1].total-a[1].total);
    document.getElementById('rpCompanyTable').innerHTML = compRows.length ? `<table><thead><tr><th>কোম্পানি</th><th>Invoice সংখ্যা</th><th>মোট বিক্রি</th></tr></thead>
    <tbody>${compRows.map(([cid,d])=>`<tr><td>${esc(companyName(cid))}</td><td>${d.count}</td><td>${money(d.total)}</td></tr>`).join('')}</tbody></table>`
    : `<div class="empty">এই পরিসীমায় কোনো বিক্রি নেই।</div>`;

    const byArea = {};
    rows.forEach(r=>{
      const key = r.areaId || '__none__';
      byArea[key] ||= {total:0, paid:0, baki:0, count:0};
      const x = byArea[key];
      x.total += Number(r.total||0); x.paid += Number(r.paid||0); x.baki += Number(r.baki||0); x.count++;
    });
    const areaRows = Object.entries(byArea).sort((a,b)=>b[1].total-a[1].total);
    document.getElementById('rpAreaTable').innerHTML = areaRows.length ? `<table><thead><tr><th>এরিয়া</th><th>Invoice সংখ্যা</th><th>মোট বিক্রি</th><th>Paid</th><th>Baki</th></tr></thead>
    <tbody>${areaRows.map(([aid,d])=>{
      const label = aid==='__none__' ? 'এরিয়া উল্লেখ নেই' : esc((DB.areas.find(a=>a.id===aid)||{}).name||'—');
      return `<tr><td>${label}</td><td>${d.count}</td><td>${money(d.total)}</td><td>${money(d.paid)}</td><td>${d.baki>0?`<span class="tag due">${money(d.baki)}</span>`:money(d.baki)}</td></tr>`;
    }).join('')}</tbody></table>`
    : `<div class="empty">এই পরিসীমায় কোনো বিক্রি নেই।</div>`;

    const byCustomer = {};
    rows.forEach(r=>{
      const key = r.customerId || customerKey(r.customerName, r.customerPhone);
      byCustomer[key] ||= {name:r.customerName, phone:r.customerPhone, areaId:r.areaId, total:0, paid:0, baki:0, count:0};
      const x = byCustomer[key];
      x.total += Number(r.total||0); x.paid += Number(r.paid||0); x.baki += Number(r.baki||0); x.count++;
    });
    const custRows = Object.values(byCustomer).sort((a,b)=>b.total-a.total);
    RP_CUSTOMER_ROWS = custRows;
    document.getElementById('rpCustomerTable').innerHTML = custRows.length ? `<table><thead><tr><th>এরিয়া</th><th>Customer</th><th>Invoice সংখ্যা</th><th>মোট বিক্রি</th><th>Paid</th><th>Baki</th><th>Statement</th></tr></thead>
    <tbody>${custRows.map((d,idx)=>{
      const areaLabel = d.areaId ? esc((DB.areas.find(a=>a.id===d.areaId)||{}).name||'—') : '—';
      return `<tr><td>${areaLabel}</td><td>${esc(d.name||'—')}</td><td>${d.count}</td><td>${money(d.total)}</td><td>${money(d.paid)}</td><td>${d.baki>0?`<span class="tag due">${money(d.baki)}</span>`:money(d.baki)}</td><td><button class="btn small" data-rp-cust-statement="${idx}" type="button">📄 PDF</button></td></tr>`;
    }).join('')}</tbody></table>`
    : `<div class="empty">এই পরিসীমায় কোনো Customer নেই।</div>`;
    document.querySelectorAll('[data-rp-cust-statement]').forEach(b=>b.addEventListener('click', ()=>{
      const d = RP_CUSTOMER_ROWS[Number(b.dataset.rpCustStatement)];
      if(d) openCustomerStatement(d.name, d.phone);
    }));

    const sorted = [...rows].sort((a,b)=>b.date.localeCompare(a.date));
    document.getElementById('rpDetailTable').innerHTML = sorted.length ? `<table><thead><tr>
      <th>Invoice</th><th>তারিখ</th><th>কোম্পানি</th><th>এরিয়া</th><th>Customer</th><th>মোট</th><th>Paid</th><th>Baki</th></tr></thead>
      <tbody>${sorted.map(s=>`<tr><td>${esc(s.invoiceNo)}</td><td>${s.date}</td><td>${esc(companyName(s.companyId))}</td>
      <td>${s.areaId?esc((DB.areas.find(a=>a.id===s.areaId)||{}).name||'—'):'—'}</td>
      <td>${esc(s.customerName)}</td><td>${money(s.total)}</td><td>${money(s.paid)}</td><td>${money(s.baki)}</td></tr>`).join('')}</tbody></table>`
      : `<div class="empty">কোনো তথ্য নেই।</div>`;
  }
  from.addEventListener('change', draw); to.addEventListener('change', draw); compSel.addEventListener('change', draw);
  areaSel.addEventListener('change', ()=>{ refreshCustomerFilterOptions(); custSel.value=''; draw(); });
  custSel.addEventListener('change', draw);
  draw();

  // ---- প্রোডাক্ট ওয়াইজ সেলস রিপোর্ট (নিজস্ব তারিখ ফিল্টার) ----
  const prodPreset = document.getElementById('rpProdPreset');
  const prodFrom = document.getElementById('rpProdFrom'), prodTo = document.getElementById('rpProdTo');
  const prodCompSel = document.getElementById('rpProdCompany');

  function setProdPresetDates(){
    const now = new Date();
    let f = new Date(now), t = new Date(now);
    if(prodPreset.value==='daily'){ /* today */ }
    else if(prodPreset.value==='weekly'){ f.setDate(now.getDate() - now.getDay()); }
    else if(prodPreset.value==='monthly'){ f = new Date(now.getFullYear(), now.getMonth(), 1); }
    else if(prodPreset.value==='yearly'){ f = new Date(now.getFullYear(), 0, 1); }
    else { return; }
    prodFrom.value = f.toISOString().slice(0,10);
    prodTo.value = t.toISOString().slice(0,10);
  }
  prodPreset.addEventListener('change', ()=>{ setProdPresetDates(); drawProductReport(); });
  setProdPresetDates();

  function drawProductReport(){
    let prows = DB.sales;
    if(prodFrom.value) prows = prows.filter(s=>s.date >= prodFrom.value);
    if(prodTo.value) prows = prows.filter(s=>s.date <= prodTo.value);
    if(prodCompSel.value) prows = prows.filter(s=>(s.companyIds||[s.companyId]).includes(prodCompSel.value));

    const byProduct = {};
    prows.forEach(s=>{
      (s.items||[]).forEach(it=>{
        const pid = it.productId;
        const p = productById(pid);
        byProduct[pid] ||= {name: p?.name || it.name || '—', code: p?.code||'', qty:0, amount:0};
        byProduct[pid].qty += Number(it.qty||0);
        byProduct[pid].amount += Number(it.amount||0);
      });
    });
    const prodRows = Object.values(byProduct).sort((a,b)=>b.amount-a.amount);
    const totalQty = prodRows.reduce((s,r)=>s+r.qty,0);
    const totalAmt = prodRows.reduce((s,r)=>s+r.amount,0);
    document.getElementById('rpProductSummary').innerHTML = `
      <div class="stat-card"><div class="lbl">মোট Product (বিক্রি হয়েছে)</div><div class="val">${prodRows.length}</div></div>
      <div class="stat-card"><div class="lbl">মোট বিক্রিত Quantity</div><div class="val">${totalQty}</div></div>
      <div class="stat-card green"><div class="lbl">মোট বিক্রি</div><div class="val">${money(totalAmt)}</div></div>`;
    document.getElementById('rpProductTable').innerHTML = prodRows.length ? `<table><thead><tr><th>Product</th><th>কোড</th><th>বিক্রিত Quantity</th><th>মোট বিক্রি</th></tr></thead>
    <tbody>${prodRows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.code)}</td><td>${r.qty}</td><td>${money(r.amount)}</td></tr>`).join('')}</tbody></table>`
    : `<div class="empty">এই পরিসীমায় কোনো বিক্রি নেই।</div>`;
  }
  prodFrom.addEventListener('change', ()=>{ prodPreset.value='custom'; drawProductReport(); });
  prodTo.addEventListener('change', ()=>{ prodPreset.value='custom'; drawProductReport(); });
  prodCompSel.addEventListener('change', drawProductReport);
  drawProductReport();
}

  );

      <div class="grid-cards" style="margin-bottom:14px">

        <div class="stat-card green"><div class="lbl">Active</div><div class="val">${DB.users.filter(u=>u.status!=='inactive').length}</div></div>
        <div class="stat-card red"><div class="lbl">Inactive</div><div class="val">${DB.users.filter(u=>u.status==='inactive').length}</div></div>
      </div>

      <form id="userForm" class="form-grid">

        <div class="f-item"><label>Password ${edit?'':'*'}</label><input id="usrPassword" type="text" placeholder="${edit&&edit.password?'পরিবর্তন না করলে খালি রাখুন':'পাসওয়ার্ড দিন'}"></div>
        <div class="f-item"><label>স্ট্যাটাস</label><select id="usrStatus">
          <option value="active" ${edit?.status==='inactive'?'':'selected'}>Active</option>
          <option value="inactive" ${edit?.status==='inactive'?'selected':''}>Inactive</option>
        </select></div>
        <div class="f-item" style="grid-column:1/-1">
          <label>প্রবেশাধিকার (কোন কোন সেকশন দেখতে পারবে)</label>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:6px;padding:12px;background:#faf8f2;border:1px solid var(--line);border-radius:8px;">
            ${permItems.map(i=>`<label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;cursor:pointer;">
              <input type="checkbox" class="usrPagePerm" value="${i.id}" ${editPages.includes(i.id)?'checked':''}> <span>${i.ico}</span> <span>${i.label}</span>

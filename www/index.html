<title>ডিস্ট্রিবিউটর ম্যানেজমেন্ট সফটওয়্যার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2942;
  --navy-2:#16395c;
  --gold:#b8863f;
  --gold-light:#e8c98a;
  --cream:#faf7f0;
  --paper:#ffffff;
  --line:#e3dcc9;
  --ink:#1c2530;
  --muted:#6b7280;
  --green:#1e7d4a;
  --red:#b3392c;
  --amber:#a9741d;
  --radius:10px;
  --shadow:0 1px 3px rgba(15,41,66,.08), 0 1px 2px rgba(15,41,66,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Hind Siliguri', 'Tiro Bangla', sans-serif;
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#d8cfb5;border-radius:6px;}

/* ---------- LOGIN ---------- */
#loginScreen{
  display:none;
  min-height:100vh;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(184,134,63,.18), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(184,134,63,.12), transparent 45%),
    linear-gradient(160deg, var(--navy) 0%, #0a1a2b 100%);
}
.login-card{
  background:var(--paper);
  width:360px; max-width:90vw;
  border-radius:14px;
  padding:38px 34px 30px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  text-align:center;
  border-top:4px solid var(--gold);
}
.login-mark{
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(145deg,var(--gold-light),var(--gold));
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px; font-size:24px; color:var(--navy); font-weight:700;
}
.login-card h1{font-size:19px;margin:0 0 4px;color:var(--navy);}
.login-card p.sub{color:var(--muted);font-size:13px;margin:0 0 18px;}
.login-tabs{display:flex;gap:6px;background:#f0ede3;border-radius:9px;padding:4px;margin-bottom:18px;}
.login-tabs .login-tab{
  flex:1;padding:9px 6px;border:none;border-radius:6px;background:transparent;color:var(--muted);
  font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:background .15s ease,color .15s ease;
}
.login-tabs .login-tab.active{background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(15,41,66,.25);}
.field{text-align:left;margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;}
.field input{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  font-family:inherit;font-size:14px;background:#fbfaf6;
}
.field input:focus{outline:2px solid var(--gold-light);border-color:var(--gold);}
.btn-primary{
  width:100%;padding:11px;border:none;border-radius:8px;
  background:linear-gradient(145deg,var(--navy-2),var(--navy));
  color:#fff;font-weight:600;font-size:14.5px;cursor:pointer;letter-spacing:.3px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(15,41,66,.3);}
.login-error{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px;}
.login-hint{margin-top:18px;font-size:11.5px;color:#a9a08a;border-top:1px dashed var(--line);padding-top:12px;}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex:0 0 230px;background:var(--navy);color:#dfe6ee;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand .name{font-weight:700;font-size:16px;color:#fff;}
.brand .tag{font-size:11px;color:var(--gold-light);letter-spacing:.5px;}
.nav{padding:10px 0;flex:1;}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:right;
  background:none;border:none;color:#c6d0dc;padding:10px 18px;font-size:13.5px;
  cursor:pointer;font-family:inherit;border-right:3px solid transparent;
  flex-direction:row-reverse;justify-content:flex-end;
}
.nav button .ico{width:18px;text-align:center;font-size:14px;flex-shrink:0;}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav button.active{background:rgba(184,134,63,.18);color:#fff;border-right-color:var(--gold);font-weight:600;}
.nav .divider{height:1px;background:rgba(255,255,255,.08);margin:8px 16px;}
.sidebar-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);}
.sidebar-foot button{
  width:100%;padding:9px;border:1px solid rgba(255,255,255,.18);background:transparent;
  color:#dfe6ee;border-radius:7px;cursor:pointer;font-family:inherit;font-size:12.5px;
}
.sidebar-foot button:hover{background:rgba(255,255,255,.08);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--paper);border-bottom:1px solid var(--line);
  padding:14px 26px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:5;
}
.topbar h2{margin:0;font-size:18px;color:var(--navy);}
.topbar .date{font-size:12.5px;color:var(--muted);}
.content{padding:22px 26px 60px;flex:1;}

/* ---------- COMPONENTS ---------- */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{
  background:var(--paper);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);
  border-left:4px solid var(--gold);
}
.stat-card .lbl{font-size:12px;color:var(--muted);margin-bottom:6px;}
.stat-card .val{font-size:22px;font-weight:700;color:var(--navy);}
.stat-card.red{border-left-color:var(--red);}
.stat-card.green{border-left-color:var(--green);}
.stat-card.amber{border-left-color:var(--amber);}

.panel{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.panel-head h3{margin:0;font-size:15px;color:var(--navy);}
.panel-body{padding:18px;}

.btn{
  padding:8px 16px;border-radius:7px;border:1px solid var(--line);background:#fff;
  cursor:pointer;font-family:inherit;font-size:13px;color:var(--ink);
}
.btn:hover{background:#f5f2ea;}
.btn.gold{background:var(--navy);color:#fff;border-color:var(--navy);}
.btn.gold:hover{background:var(--navy-2);}
.btn.danger{color:var(--red);border-color:#e7c9c4;}
.btn.danger:hover{background:#fdf1ef;}
.btn.small{padding:5px 10px;font-size:12px;}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}
.form-grid.two{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
.f-item label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;}
.f-item input,.f-item select,.f-item textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;
  font-family:inherit;font-size:13.5px;background:#fbfaf6;
}
.f-item input:focus,.f-item select:focus,.f-item textarea:focus{outline:none;border-color:var(--gold);background:#fff;}
.form-actions{margin-top:16px;display:flex;gap:10px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:right;background:#f6f2e8;color:var(--navy);font-weight:600;
  padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap;
}
tbody td{padding:9px 12px;border-bottom:1px solid #f0ede3;text-align:right;}
tbody tr:hover{background:#fbf9f3;}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
.tag.ok{background:#e4f5eb;color:var(--green);}
.tag.low{background:#fdeceb;color:var(--red);}
.tag.due{background:#fdeceb;color:var(--red);}
.tag.paid{background:#e4f5eb;color:var(--green);}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13.5px;}
.small-note{font-size:11.5px;color:var(--muted);margin-top:4px;}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
select,input[type=date],input[type=text],input[type=number],input[type=tel]{font-family:inherit;}
.cart-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px;}
.cart-total{text-align:left;font-weight:700;color:var(--navy);font-size:15px;margin-top:8px;}
.pill{display:inline-block;background:#f0ede3;color:var(--navy);border-radius:20px;padding:2px 10px;font-size:11.5px;margin-right:4px;}
.close-x{background:none;border:none;cursor:pointer;color:var(--red);font-size:16px;}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:10px 22px;border-radius:8px;font-size:13.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
  z-index:999;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.hamb{display:none;background:none;border:none;font-size:20px;color:var(--navy);cursor:pointer;padding:4px 6px;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(10,20,32,.45);z-index:40;}
.sidebar-overlay.show{display:block;}

/* ============ RESPONSIVE ============ */
@media(max-width:880px){
  .sidebar{position:fixed;left:-240px;top:0;transition:left .2s ease;z-index:50;width:230px;height:100vh;}
  .sidebar.open{left:0;box-shadow:0 0 30px rgba(0,0,0,.35);}
  .content{padding:16px;}
  .topbar{padding:12px 16px;}
  .hamb{display:block;}
}
@media(min-width:881px){
  .sidebar-overlay{display:none!important;}
}
@media(max-width:680px){
  .topbar{flex-wrap:wrap;gap:8px;padding:10px 14px;}
  .topbar h2{font-size:16px;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .topbar .date{font-size:11px;}
  .content{padding:12px;}
  .grid-cards{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
  .stat-card{padding:12px 14px;}
  .stat-card .val{font-size:18px;}
  .panel-body{padding:14px;}
  .panel-head{padding:12px 14px;}
  .panel-head h3{font-size:14px;}
  .form-grid,.form-grid.two{grid-template-columns:1fr;gap:10px;}
  .cart-row{grid-template-columns:1fr 1fr;grid-template-areas:"prod prod" "qty rate" "btn btn";}
  .cart-row select{grid-area:prod;}
  .cart-row input:nth-of-type(1){grid-area:qty;}
  .cart-row input:nth-of-type(2){grid-area:rate;}
  .cart-row button{grid-area:btn;width:100%;}
  .cart-row > div:empty{display:none;}
  table{font-size:12px;}
  thead th,tbody td{padding:7px 8px;}
  .btn{padding:9px 14px;font-size:13px;}
  .form-actions{flex-wrap:wrap;}
  .form-actions .btn{flex:1;min-width:110px;}
  .filters{gap:8px;}
  .login-card{padding:30px 22px 24px;}
}
@media(max-width:420px){
  .topbar h2{max-width:50vw;font-size:14.5px;}
  .grid-cards{grid-template-columns:1fr 1fr;}
  .stat-card .val{font-size:16px;}
  table{font-size:11.5px;}
}
</style>
</head>

</div>

function loadDB(){
  try{
    // Use a new storage key so the corrected version cannot keep showing stale
    // profit/margin values from the previous version. Preserve the user's old
    // data by importing it once, then immediately recalculate every invoice.
    let raw = localStorage.getItem(DB_KEY);
    if(!raw) raw = localStorage.getItem(OLD_DB_KEY);
    if(!raw){
      const seeded = Object.assign(emptyDB(), SEED_DB);
      localStorage.setItem(DB_KEY, JSON.stringify(seeded));
      return seeded;
    }
    const parsed = JSON.parse(raw);
    return Object.assign(emptyDB(), parsed);
  }catch(e){ return emptyDB(); }
}
function saveDB(){
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
  try{ if(window.SRCloud && SRCloud.save) SRCloud.save(DB); }catch(e){ console.warn('Cloud sync skipped', e); }
}

let loginRole = 'admin';
let CURRENT_ROLE = 'admin';
let CURRENT_EMP = null;
let CURRENT_USER = null;
const ADMIN_ONLY_PAGES = ['salary','reports','backup'];
// Cashbook, Salary, Reports, Backup, and User Management are all strictly
// Admin-only. Non-admin logins never see or access these, regardless of any
// per-user page permission the Admin might otherwise try to grant.
const NON_ADMIN_BLOCKED_PAGES = ['salary','reports','backup','users','cashbook'];

// Access check for non-admin logins.
// - 'users' and 'cashbook' pages are always Admin-only, no matter what.
// - 'dashboard' is always visible.
// - Users created via User Management get exactly the allowed pages for everything else.
// - Supplier Payment is available only when Admin grants it.
function pageAllowed(pageId){
  if(CURRENT_ROLE==='admin') return true;
  // Hard security rule: these sections are Admin-only.
  if(NON_ADMIN_BLOCKED_PAGES.includes(pageId)) return false;
  if(pageId==='dashboard') return true;
  if(CURRENT_USER) return (CURRENT_USER.pages||[]).includes(pageId);
  return !NON_ADMIN_BLOCKED_PAGES.includes(pageId);
}


// Non-admin users can see sales data only as a delivery challan.
// They cannot see purchase rate, profit, margin, commission or profit reports.
function isAdmin(){ return CURRENT_ROLE==='admin'; }
function canSeeProfit(){ return isAdmin(); }

// Non-admin users are strictly read-only for all existing records.
// They may only perform the explicitly permitted create actions
// (Cashbook জমা/খরচ and Supplier Payment). Edit/Delete always require Admin.
function canEditDelete(){ return isAdmin(); }
function adminOnlyMutation(actionName){
  if(!isAdmin()){
    alert(`এই ${actionName} শুধুমাত্র Admin করতে পারবেন।`);
    return false;
  }
  return true;
}

function setLoginTab(role){
  loginRole = role;
  document.getElementById('tabAdmin').classList.toggle('active', role==='admin');
  document.getElementById('tabEmployee').classList.toggle('active', role==='employee');
  document.getElementById('loginError').textContent = '';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  if(role==='admin'){
    document.getElementById('loginUser').placeholder = 'admin';
    document.getElementById('loginHint').textContent = 'ডেমো লগইন — admin / 1234';
  } else {

}

document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  if(loginRole==='admin'){
    if(u === 'admin' && p === String(DB.adminPassword || '1234')){
      CURRENT_ROLE = 'admin'; CURRENT_EMP = null; CURRENT_USER = null;
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({role:'admin'}));
      err.textContent = '';
      startApp();
    } else {
      err.textContent = 'ভুল Username অথবা Password';
    }
  } else {
    const usr = (DB.users||[]).find(x=>x.username && x.username===u && x.password===p);
    if(usr && u && p){
      if(usr.status==='inactive'){ err.textContent='এই একাউন্টটি বর্তমানে নিষ্ক্রিয়।'; return; }
      CURRENT_ROLE = 'employee'; CURRENT_USER = usr; CURRENT_EMP = null;
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({role:'employee', kind:'user', id:usr.id}));
      err.textContent = '';
      startApp();
      return;
    }
    const emp = (DB.employees||[]).find(x=>x.username && x.username===u && x.password===p);
    if(emp && u && p){
      if(emp.status==='inactive'){ err.textContent='এই একাউন্টটি বর্তমানে নিষ্ক্রিয়।'; return; }
      CURRENT_ROLE = 'employee'; CURRENT_EMP = emp; CURRENT_USER = null;
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({role:'employee', kind:'emp', id:emp.id}));
      err.textContent = '';
      startApp();
    } else {
      err.textContent = 'ভুল Username অথবা Password';
    }
  }
}
function doLogout(){
  sessionStorage.removeItem(SESSION_KEY);
  CURRENT_ROLE = 'admin'; CURRENT_EMP = null; CURRENT_USER = null;
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginUser').value='';
  document.getElementById('loginPass').value='';
  setLoginTab('admin');
}

  const attrNames=['data-edit-sp','data-del-sp','data-sale-edit','data-sale-del','data-edit-product','data-del-prod','data-edit-opening',
    'data-lift-edit','data-lift-del','data-damage-edit','data-damage-delete','data-edit-cb','data-del-cb',

    'data-edit-sr','data-del-sr','data-edit-cp','data-del-cp','data-edit-daily-baki','data-del-daily-baki',
    'data-edit-emp','data-del-emp'];
  if(attrNames.some(a=>b.hasAttribute(a))){
    e.preventDefault();
    e.stopImmediatePropagation();
    alert('এডিট বা ডিলিট করার অনুমতি নেই। Admin-এর সাহায্য প্রয়োজন।');
  }
}, true);

function restoreSession(){
  const raw = sessionStorage.getItem(SESSION_KEY);
  if(!raw) return;
  let sess = null;
  try{ sess = JSON.parse(raw); }catch(e){ sess = (raw==='1') ? {role:'admin'} : null; }
  if(!sess) return;
  if(sess.role==='employee'){
    if(sess.kind==='user'){
      const usr = (DB.users||[]).find(x=>x.id===sess.id);
      if(!usr){ sessionStorage.removeItem(SESSION_KEY); return; }
      CURRENT_ROLE='employee'; CURRENT_USER=usr; CURRENT_EMP=null;
    } else {
      const emp = (DB.employees||[]).find(x=>x.id===(sess.id||sess.empId));
      if(!emp){ sessionStorage.removeItem(SESSION_KEY); return; }
      CURRENT_ROLE='employee'; CURRENT_EMP=emp; CURRENT_USER=null;
    }
  } else {
    CURRENT_ROLE='admin'; CURRENT_EMP=null; CURRENT_USER=null;
  }
  startApp();
}

function startApp(){
  // Recalculate all invoices before any screen/PDF is rendered.
  if(DB && Array.isArray(DB.sales)){ DB.sales.forEach(s=>recalcSale(s)); saveDB(); }
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('topDate').textContent = new Date().toLocaleDateString('bn-BD',{year:'numeric',month:'long',day:'numeric'});
  const foot = document.getElementById('sidebarUserLabel');
  if(foot) foot.textContent = CURRENT_ROLE==='admin' ? 'এডমিন হিসেবে লগইন' : ('লগইন: '+ (CURRENT_USER?CURRENT_USER.name:(CURRENT_EMP?CURRENT_EMP.name:'')));
  buildNav();
  navigate('dashboard');
}

function buildNav(){
  const nav = document.getElementById('navMenu');
  nav.innerHTML='';
  let lastWasSep = true;
  NAV_ITEMS.forEach(item=>{
    if(item.sep){
      if(!lastWasSep){ const d=document.createElement('div'); d.className='divider'; nav.appendChild(d); lastWasSep=true; }
      return;
    }
    if(!pageAllowed(item.id)) return;
    const b = document.createElement('button');
    b.dataset.page = item.id;
    b.innerHTML = `<span>${item.label}</span><span class="ico">${item.ico}</span>`;
    b.addEventListener('click', ()=>{ navigate(item.id); document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('show'); });
    nav.appendChild(b);
    lastWasSep = false;
  });
  while(nav.lastChild && nav.lastChild.className==='divider') nav.removeChild(nav.lastChild);
}

// Return records can come from older versions with slightly different field names.
// Always resolve them by Sales ID first, then by Invoice Number, and calculate the
// amount from items if the saved total is missing.
function linkedSalesReturns(s){
  if(!s) return [];
  return (DB.salesReturns||[]).filter(r =>
    (String(r.salesId||'')===String(s.id||'') || String(r.saleId||'')===String(s.id||'') ||
     String(r.invoiceNo||'').trim()===String(s.invoiceNo||'').trim())
  );
}
function salesReturnTotal(r){
  if(!r) return 0;
  const itemTotal=(r.items||[]).reduce((sum,it)=>sum + Number(it.amount!=null ? it.amount : (Number(it.qty||0)*Number(it.rate||0))),0);
  if(itemTotal>0) return itemTotal;
  const saved=Number(r.total);
  return Number.isFinite(saved) && saved>0 ? saved : 0;
}

// Recompute an invoice's Damage/Gross Profit/Net Profit/Margin from its items + linked Damage records.
// Damage reduces the Invoice Total by its full sale value, but should only reduce Profit by the
// profit portion of the damaged items (sale rate - purchase price), not their full sale value.
function recalcSale(s){
  if(!s)return;
  const items=s.items||[];
  const damages=(DB.damages||[]).filter(d=>d.salesId===s.id);

  // SINGLE SOURCE OF TRUTH:
  // Net Sales = Subtotal - Discount - Damage
  // Gross Profit = original line profit - Discount - Damage
  // Damage is an invoice-level loss/adjustment and must reduce Gross Profit
  // by its full recorded Damage value. Do NOT subtract Damage from COGS again.
  // Net Profit = Gross Profit - Commission
  // Gross/Net Margin = Profit / Net Sales * 100
  const subtotal=items.reduce((sum,it)=>sum+Number(it.qty||0)*Number(it.rate||0),0);
  const discountAmount=Math.min(Math.max(Number(s.discountAmount||0),0),subtotal);
  const totalDamage=damages.reduce((sum,d)=>sum+Number(d.total||0),0);
  // Sales Return is an invoice-level deduction: returned goods reduce the
  // invoice total and customer balance, while returned quantity comes back
  // into stock.  Returns are linked by salesId.
  const returns=linkedSalesReturns(s);
  const totalReturn=returns.reduce((sum,r)=>sum+salesReturnTotal(r),0);
  const netSales=Math.max(subtotal-discountAmount-totalDamage-totalReturn,0);

  // Original Gross Profit = sum of the line-level profits shown on the invoice.
  // Use the product purchase price that belongs to each invoice line.
  const originalGrossProfit=items.reduce((sum,it)=>{
    const p=productById(it.productId);
    const qty=Number(it.qty||0);
    const saleRate=Number(it.rate||0);
    const purchase=Number(it.purchasePrice ?? it.purchaseRate ?? p?.purchasePrice ?? 0);
    return sum + (saleRate-purchase)*qty;
  },0);

  // IMPORTANT: Damage reduces Net Sales by its FULL SALE VALUE, but it reduces
  // Gross Profit only by the PROFIT that would have been earned on those
  // damaged units (sale rate - purchase price) * damaged quantity.
  // Example from INV-1014: Damage = ৳1,079, while Damage Profit Loss ≈ ৳38.58.
  const damageProfitLoss=damages.reduce((sum,d)=>{
    const p=productById(d.productId);
    const qty=Number(d.qty||0);
    const saleRate=Number(d.rate||0);
    const purchase=Number(d.purchasePrice ?? d.purchaseRate ?? p?.purchasePrice ?? 0);
    return sum + Math.max((saleRate-purchase)*qty,0);
  },0);

  // Discount is also a reduction of profit because the customer paid less.
  // Sales Return also reverses the profit of the returned units.
  const returnProfitLoss=returns.reduce((sum,r)=>{
    return sum + (r.items||[]).reduce((rs,it)=>{
      const p=productById(it.productId);
      const qty=Number(it.qty||0);
      const saleRate=Number(it.rate||0);
      const purchase=Number(it.purchasePrice ?? it.purchaseRate ?? p?.purchasePrice ?? 0);
      return rs + Math.max((saleRate-purchase)*qty,0);
    },0);
  },0);
  const grossProfit=originalGrossProfit-discountAmount-damageProfitLoss-returnProfitLoss;
  const commission=Math.max(Number(s.commission||0),0);
  const netProfit=grossProfit-commission;
  const grossMargin=netSales?(grossProfit/netSales*100):0;
  const netMargin=netSales?(netProfit/netSales*100):0;

  s.subtotal=subtotal;
  s.discountAmount=discountAmount;
  s.damageAmount=totalDamage;
  s.returnAmount=totalReturn;
  s.total=netSales;
  s.grossProfit=grossProfit;
  s.grossMargin=grossMargin;
  s.netProfit=netProfit;
  s.netMargin=netMargin;
  s.margin=netMargin;
  s.commission=commission;
  s.baki=Math.max(netSales-Number(s.paid||0),0);
}

// Rebuild all saved invoices when the software opens so old/stale
// Gross Profit, Net Profit and Margin values are corrected immediately.
function migrateDamageProfits(){
  if(!DB.sales||!DB.sales.length) return;
  // Force a full recalculation of every saved invoice on every load.
  // This removes stale Gross/Net Profit values left by older versions.
  DB.sales.forEach(s=>recalcSale(s));
  saveDB();
}

function productStock(pid){
  const p = productById(pid);
  if(!p) return 0;
  let lifted=0, sold=0, returned=0;
  DB.liftings.forEach(l=> l.items.forEach(it=>{ if(it.productId===pid) lifted+=Number(it.qty); }));
  DB.sales.forEach(s=> s.items.forEach(it=>{ if(it.productId===pid) sold+=Number(it.qty); }));
  DB.salesReturns.forEach(r=> r.items.forEach(it=>{ if(it.productId===pid) returned+=Number(it.qty); }));
  const damaged = (DB.damages||[]).reduce((sum,d)=>sum + (d.productId===pid ? Number(d.qty||0) : 0),0);
  return Number(p.openingStock||0) + lifted - sold + returned - damaged;
}

function companySupplierBaki(companyId){
  let baki=0;
  DB.liftings.filter(l=>l.companyId===companyId).forEach(l=> baki += Number(l.baki||0));
  DB.supplierPayments.filter(p=>p.companyId===companyId).forEach(p=> baki -= Number(p.amount||0));
  return baki;
}

function customerKey(name, phone){ return (name||'').trim().toLowerCase()+'|'+(phone||'').trim(); }

function allCustomers(){
  const map = {};
  DB.sales.forEach(s=>{
    const k = customerKey(s.customerName, s.customerPhone);
    if(!map[k]) map[k] = {name:s.customerName, phone:s.customerPhone, sales:0, paid:0, returns:0, collected:0};
    map[k].sales += Number(s.total||0);
    map[k].paid += Number(s.paid||0);
  });
  DB.salesReturns.forEach(r=>{
    const k = customerKey(r.customerName, r.customerPhone);
    if(!map[k]) map[k] = {name:r.customerName, phone:r.customerPhone, sales:0, paid:0, returns:0, collected:0};
    map[k].returns += Number(r.total||0);
  });
  DB.customerPayments.forEach(p=>{
    // Invoice-linked collections already increase that invoice's paid amount,
    // so they must NOT be deducted a second time here. Only old/unallocated
    // customer collections are deducted from the customer-level balance.
    if(p.salesId) return;
    const k = customerKey(p.customerName, p.customerPhone);
    if(!map[k]) map[k] = {name:p.customerName, phone:p.customerPhone, sales:0, paid:0, returns:0, collected:0};
    map[k].collected += Number(p.amount||0);
  });
  return Object.values(map).map(c=>({...c, baki: c.sales - c.paid - c.returns - c.collected}));
}

function addCashbook(type, amount, note, source){
  if(Number(amount) <= 0) return;
  DB.cashbook.push({id:uid('cb'), date:todayStr(), type, amount:Number(amount), note, source});
}

function nextInvoice(type){
  DB.invoiceCounters[type] = (DB.invoiceCounters[type]||1000) + 1;
  const prefix = type==='lifting' ? 'LFT' : 'INV';
  return prefix + '-' + DB.invoiceCounters[type];
}

function renderDashboard(){
  const totalProducts = DB.products.length;
  const lowStock = DB.products.filter(p=> productStock(p.id) <= Number(p.minStock||0)).length;
  const totalSupplierBaki = DB.companies.reduce((s,c)=> s+companySupplierBaki(c.id),0);
  const totalCustomerBaki = allCustomers().reduce((s,c)=> s+c.baki,0);
  const today = todayStr();
  const todaySales = DB.sales.filter(s=>s.date===today).reduce((s,x)=>s+Number(x.total||0),0);
  const todayCollection = DB.cashbook.filter(c=>c.date===today && c.type==='in').reduce((s,x)=>s+Number(x.amount||0),0);
  const todayExpense = DB.cashbook.filter(c=>c.date===today && c.type==='out').reduce((s,x)=>s+Number(x.amount||0),0);
  // Dashboard Damage is shown for the current calendar month only.
  const currentMonth = today.slice(0,7);
  const monthlyDamage = (DB.damages||[])
    .filter(d=>String(d.date||'').slice(0,7)===currentMonth)
    .reduce((s,d)=>s+Number(d.total||0),0);

  const recentSales = [...DB.sales].sort((a,b)=> b.date.localeCompare(a.date)).slice(0,6);

  return `
  <div class="grid-cards">
    <div class="stat-card red"><div class="lbl">এই মাসের Damage Value</div><div class="val">${money(monthlyDamage)}</div></div>
    <div class="stat-card"><div class="lbl">মোট কোম্পানি</div><div class="val">${DB.companies.length}</div></div>
    <div class="stat-card"><div class="lbl">মোট Product</div><div class="val">${totalProducts}</div></div>
    <div class="stat-card ${lowStock>0?'red':''}"><div class="lbl">Low Stock Product</div><div class="val">${lowStock}</div></div>
    <div class="stat-card amber"><div class="lbl">Total Supplier Baki</div><div class="val">${money(totalSupplierBaki)}</div></div>
    <div class="stat-card red"><div class="lbl">Total Customer Baki</div><div class="val">${money(totalCustomerBaki)}</div></div>
    <div class="stat-card green"><div class="lbl">আজকের বিক্রি</div><div class="val">${money(todaySales)}</div></div>
    ${isAdmin()?`<div class="stat-card green"><div class="lbl">আজকের জমা</div><div class="val">${money(todayCollection)}</div></div>
    <div class="stat-card red"><div class="lbl">আজকের খরচ</div><div class="val">${money(todayExpense)}</div></div>`:''}
  </div>
  <div class="panel">
    <div class="panel-head"><h3>সাম্প্রতিক Sales Invoice</h3></div>
    <div class="panel-body table-wrap">
      ${recentSales.length ? `<table><thead><tr>
        <th>Invoice</th><th>তারিখ</th><th>কোম্পানি</th><th>Customer</th><th>মোট</th><th>Paid</th><th>Baki</th>
      </tr></thead><tbody>
      ${recentSales.map(s=>`<tr>
        <td>${esc(s.invoiceNo)}</td><td>${s.date}</td><td>${esc(companyName(s.companyId))}</td>
        <td>${esc(s.customerName)}</td><td>${money(s.total)}</td><td>${money(s.paid)}</td>
        <td>${s.baki>0?`<span class="tag due">${money(s.baki)}</span>`:`<span class="tag paid">পরিশোধিত</span>`}</td>
      </tr>`).join('')}

    if(!companySel||!catSel) return;

    catSel.innerHTML = cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('') || `<option value="">— কোনো Category নেই —</option>`;
  }
  if(companySel){ companySel.addEventListener('change', refreshCats); refreshCats(); }
  const pPurchaseEl=document.getElementById('pPurchase'), pSellingEl=document.getElementById('pSelling'), pProfitEl=document.getElementById('pProfit'), pMarginEl=document.getElementById('pMargin');
  function autoProductProfit(){ const pp=Number(pPurchaseEl?.value)||0, sp=Number(pSellingEl?.value)||0; if(pProfitEl && !pProfitEl.dataset.manual) pProfitEl.value=(sp-pp).toFixed(2); if(pMarginEl && !pMarginEl.dataset.manual) pMarginEl.value=(sp?((sp-pp)/sp*100):0).toFixed(2); }
  [pPurchaseEl,pSellingEl].forEach(el=>el&&el.addEventListener('input',autoProductProfit));
  [pProfitEl,pMarginEl].forEach(el=>el&&el.addEventListener('input',()=>{el.dataset.manual='1';}));
  autoProductProfit();
  const f = document.getElementById('prodForm');
  if(f) f.addEventListener('submit', e=>{
    e.preventDefault();
    if(!catSel.value){ alert('এই কোম্পানির জন্য প্রথমে একটি Category তৈরি করুন।'); return; }
    DB.products.push({
      id:uid('pr'), companyId:companySel.value, categoryId:catSel.value,
      name:document.getElementById('pName').value.trim(),
      code:document.getElementById('pCode').value.trim(),
      purchasePrice:Number(document.getElementById('pPurchase').value)||0,
      sellingPrice:Number(document.getElementById('pSelling').value)||0,
      profitPerUnit:Number(document.getElementById('pProfit').value)||0,
      marginPercent:Number(document.getElementById('pMargin').value)||0,
      commissionPerUnit:Number(document.getElementById('pCommission').value)||0,
      openingStock:Number(document.getElementById('pOpening').value)||0,
      minStock:Number(document.getElementById('pMin').value)||0,
    });
    saveDB(); toast('Product যুক্ত হয়েছে'); render();
  });
  document.querySelectorAll('[data-edit-product]').forEach(b=>b.addEventListener('click',()=>{
    const p=DB.products.find(x=>x.id===b.dataset.editProduct); if(!p) return;
    const name=prompt('Product নাম:', p.name); if(name===null) return;
    const code=prompt('Product কোড:', p.code||''); if(code===null) return;
    const purchase=prompt('Purchase Price:', String(p.purchasePrice||0)); if(purchase===null) return;
    const selling=prompt('Selling Price:', String(p.sellingPrice||0)); if(selling===null) return;
    const autoProfit=(Number(selling)||0)-(Number(purchase)||0);
    const autoMargin=Number(selling)?(autoProfit/Number(selling)*100):0;
    const profit=prompt('Profit / Unit:', String(p.profitPerUnit ?? autoProfit)); if(profit===null) return;
    const margin=prompt('Margin %:', String(p.marginPercent ?? autoMargin)); if(margin===null) return;
    const commission=prompt('Commission / Unit:', String(p.commissionPerUnit||0)); if(commission===null) return;
    const min=prompt('Minimum Stock:', String(p.minStock||0)); if(min===null) return;
    const pp=Number(purchase), sp=Number(selling), pr=Number(profit), mg=Number(margin), cm=Number(commission), ms=Number(min);
    if(!name.trim() || !isFinite(pp) || pp<0 || !isFinite(sp) || sp<0 || !isFinite(pr) || pr<0 || !isFinite(mg) || mg<0 || !isFinite(cm) || cm<0 || !isFinite(ms) || ms<0){
      alert('সঠিক Product, Price, Profit, Margin ও Commission দিন।'); return;
    }
    p.name=name.trim(); p.code=code.trim(); p.purchasePrice=pp; p.sellingPrice=sp; p.profitPerUnit=pr; p.marginPercent=mg; p.commissionPerUnit=cm; p.minStock=ms;
    saveDB(); toast('Product ও Price আপডেট হয়েছে'); render();
  }));
  document.querySelectorAll('[data-del-prod]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.delProd;
      const used = DB.liftings.some(l=>l.items.some(i=>i.productId===id)) || DB.sales.some(s=>s.items.some(i=>i.productId===id));
      if(used){ alert('এই Product-এ লেনদেন যুক্ত আছে, মুছা যাবে না।'); return; }
      if(!confirm('এই Product মুছে ফেলতে চান?')) return;
      DB.products = DB.products.filter(p=>p.id!==id);
      saveDB(); toast('মুছে ফেলা হয়েছে'); render();
    });
  });  document.querySelectorAll('[data-edit-opening]').forEach(b=>b.addEventListener('click',()=>{
    const p=DB.products.find(x=>x.id===b.dataset.editOpening); if(!p) return;
    const v=prompt(`Opening Stock — ${p.name}:`, Number(p.openingStock||0)); if(v===null) return;
    const n=Number(v); if(!isFinite(n)||n<0){ alert('সঠিক Opening Stock দিন।'); return; }
    p.openingStock=n; saveDB(); toast('Opening Stock আপডেট হয়েছে'); render();
  }));
}

  <div class="wrap"><div class="head"><div><div class="name">S R Trading</div><div class="muted">Nababbari chowmini, Addarsha cumilla.</div></div><div><div class="title">LIFTING INVOICE</div><div class="muted"><b>Invoice:</b> ${esc(l.invoiceNo)}<br><b>Date:</b> ${esc(l.date)}<br><b>Company:</b> ${esc(companyName(l.companyId))}</div></div></div>

function afterLifting(){
  liftingCart = [];
  const companySel = document.getElementById('lfCompany');
  const prodArea = document.getElementById('lfProductArea');
  const cartArea = document.getElementById('lfCartArea');
  function refreshProdArea(){ prodArea.innerHTML = lfProductAreaHTML(); bindAdd(); }
  function refreshCart(){ cartArea.innerHTML = lfCartAreaHTML();
    cartArea.querySelectorAll('[data-cart-edit-qty]').forEach(b=>b.addEventListener('click', ()=>{
      const idx=Number(b.dataset.cartEditQty), it=liftingCart[idx]; if(!it) return;
      const raw=prompt(`\${it.name} — নতুন Quantity:`, String(it.qty));
      if(raw===null) return;
      const q=Number(raw);
      if(!Number.isFinite(q) || q<=0){ alert('সঠিক Quantity দিন।'); return; }
      it.qty=q; refreshCart();
    }));
    cartArea.querySelectorAll('[data-cart-del]').forEach(b=>b.addEventListener('click', ()=>{
      liftingCart.splice(Number(b.dataset.cartDel),1); refreshCart();
    }));
  }
  function bindAdd(){
    const btn = document.getElementById('lfAddBtn');
    if(!btn) return;
    btn.addEventListener('click', ()=>{
      const sel = document.getElementById('lfProduct');
      const qty = Number(document.getElementById('lfQty').value);
      const rate = Number(document.getElementById('lfRate').value);
      if(!sel.value || !qty || qty<=0){ alert('Product এবং সঠিক Quantity দিন।'); return; }
      const opt = sel.options[sel.selectedIndex];
      liftingCart.push({productId:sel.value, name:opt.textContent, qty, rate: rate || Number(opt.dataset.price)||0});
      refreshCart();
      document.getElementById('lfQty').value=''; document.getElementById('lfRate').value='';
    });
  }
  companySel.addEventListener('change', ()=>{ liftingCart=[]; refreshProdArea(); refreshCart(); });
  refreshProdArea(); refreshCart();

  document.querySelectorAll('[data-lift-pdf]').forEach(btn=>btn.addEventListener('click', ()=>{
    openLiftingInvoicePDF(btn.dataset.liftPdf);
  }));

  document.querySelectorAll('[data-lift-del]').forEach(btn=>btn.addEventListener('click', ()=>{
    const id = btn.dataset.liftDel;
    const l = DB.liftings.find(x=>x.id===id);
    if(!l) return;
    if(!confirm(`Lifting Invoice ${l.invoiceNo} মুছে ফেলবেন?`)) return;
    DB.cashbook = DB.cashbook.filter(c=>!(c.source==='lifting' && String(c.note||'').includes(l.invoiceNo)));
    DB.liftings = DB.liftings.filter(x=>x.id!==id);
    saveDB(); toast(`Lifting Invoice ${l.invoiceNo} মুছে ফেলা হয়েছে`); render();
  }));
  document.querySelectorAll('[data-lift-edit]').forEach(btn=>btn.addEventListener('click', ()=>{
    const id = btn.dataset.liftEdit;
    const l = DB.liftings.find(x=>x.id===id);
    if(!l) return;
    const date = prompt('তারিখ (YYYY-MM-DD):', l.date);
    if(date===null) return;
    for(let i=0;i<(l.items||[]).length;i++){
      const it=l.items[i];
      const p=productById(it.productId);
      const qraw=prompt(`${p?.name||it.name||'Product'} — Quantity:`, String(it.qty));
      if(qraw===null) return;
      const q=Number(qraw);
      if(!Number.isFinite(q) || q<=0){ alert('সঠিক Quantity দিন।'); return; }
      it.qty=q; it.amount=q*Number(it.rate||0);
    }
    const paidStr = prompt('Paid:', String(l.paid||0));
    if(paidStr===null) return;
    const paid = Number(paidStr);
    if(!Number.isFinite(paid) || paid<0){ alert('সঠিক Paid দিন।'); return; }
    const total = (l.items||[]).reduce((sum,it)=>sum+Number(it.qty||0)*Number(it.rate||0),0);
    l.date = date || l.date; l.paid = paid; l.total = total; l.baki = Math.max(total-paid,0);
    DB.cashbook = DB.cashbook.filter(c=>!(c.source==='lifting' && String(c.note||'').includes(l.invoiceNo)));
    if(paid>0) addCashbook('out', paid, `Lifting Payment - ${l.invoiceNo}`, 'lifting');
    saveDB(); toast(`Lifting Invoice ${l.invoiceNo} আপডেট হয়েছে`); render();
  }));

  document.getElementById('lfSaveBtn').addEventListener('click', ()=>{
    const companyId = companySel.value;
    if(!companyId){ alert('কোম্পানি নির্বাচন করুন।'); return; }
    if(!liftingCart.length){ alert('কমপক্ষে একটি Product যোগ করুন।'); return; }
    const total = liftingCart.reduce((s,i)=>s+i.qty*i.rate,0);
    const paid = Number(document.getElementById('lfPaid').value)||0;
    const baki = Math.max(total-paid,0);
    const invoiceNo = nextInvoice('lifting');
    DB.liftings.push({
      id:uid('lft'), invoiceNo, date:document.getElementById('lfDate').value||todayStr(),
      companyId, items: liftingCart.map(i=>({productId:i.productId, qty:i.qty, rate:i.rate, amount:i.qty*i.rate})),
      total, paid, baki
    });
    if(paid>0) addCashbook('out', paid, `Lifting Payment - ${invoiceNo}`, 'lifting');
    saveDB(); toast(`Lifting Invoice ${invoiceNo} সংরক্ষণ হয়েছে`);
    liftingCart=[]; render();
  });
}

function afterSupplierPayment(){
  const sel = document.getElementById('spCompany');
  if(!isAdmin()){
    function showBaki(){
      const show=document.getElementById('spBakiShow');
      if(sel && sel.value) show.textContent=`বর্তমান Supplier Baki: ${money(companySupplierBaki(sel.value))}`;
      else if(show) show.textContent='';
    }
    if(sel){
      sel.addEventListener('change',showBaki); showBaki();
      document.getElementById('spForm').addEventListener('submit',e=>{
        e.preventDefault();
        const companyId=sel.value;
        const amount=Number(document.getElementById('spAmount').value);
        if(!companyId || !amount || amount<=0){ toast('কোম্পানি ও সঠিক Payment Amount দিন'); return; }
        DB.supplierPayments.push({
          id:uid('sp'),
          date:document.getElementById('spDate').value||todayStr(),
          companyId,
          amount,
          note:document.getElementById('spNote').value.trim()
        });
        addCashbook('out',amount,`Supplier Payment - ${companyName(companyId)}`,'supplier-payment');
        saveDB();
        toast('Supplier Payment সংরক্ষণ হয়েছে');
        render();
      });
    }
    return;
  }

  function showBaki(){
    const show = document.getElementById('spBakiShow');
    if(sel.value) show.textContent = `বর্তমান Supplier Baki: ${money(companySupplierBaki(sel.value))}`;
    else show.textContent='';
  }
  sel.addEventListener('change', showBaki); showBaki();
  document.getElementById('spForm').addEventListener('submit', e=>{
    e.preventDefault();
    const companyId = sel.value;
    const amount = Number(document.getElementById('spAmount').value);
    if(!companyId || !amount || amount<=0) return;
    DB.supplierPayments.push({id:uid('sp'), date:document.getElementById('spDate').value||todayStr(), companyId, amount, note:document.getElementById('spNote').value.trim()});
    addCashbook('out', amount, `Supplier Payment - ${companyName(companyId)}`, 'supplier-payment');
    saveDB(); toast('Payment সংরক্ষণ হয়েছে'); render();
  });
  document.querySelectorAll('[data-edit-sp]').forEach(b=>b.addEventListener('click',()=>{
    if(!adminOnlyMutation('Supplier Payment Edit')) return;
    const p=DB.supplierPayments.find(x=>x.id===b.dataset.editSp); if(!p) return;
    const oldAmount=Number(p.amount)||0;
    const date=prompt('Payment তারিখ (YYYY-MM-DD):', p.date); if(date===null) return;
    const amount=Number(prompt('Payment Amount:', oldAmount)); if(!amount || amount<=0) return alert('সঠিক Amount দিন।');
    const note=prompt('নোট:', p.note||''); if(note===null) return;
    p.date=date||p.date; p.amount=amount; p.note=note;
    const cb=DB.cashbook.find(c=>c.source==='supplier-payment' && String(c.note||'')===`Supplier Payment - ${companyName(p.companyId)}` && Number(c.amount)===oldAmount);
    if(cb){ cb.amount=amount; cb.date=p.date; } else { addCashbook('out',amount,`Supplier Payment - ${companyName(p.companyId)}`,'supplier-payment'); }
    saveDB(); toast('Supplier Payment আপডেট হয়েছে'); render();
  }));
  document.querySelectorAll('[data-del-sp]').forEach(b=>b.addEventListener('click',()=>{
    if(!adminOnlyMutation('Supplier Payment Delete')) return;
    const p=DB.supplierPayments.find(x=>x.id===b.dataset.delSp); if(!p) return;
    if(!confirm('এই Supplier Payment মুছে ফেলবেন?')) return;
    const note=`Supplier Payment - ${companyName(p.companyId)}`;
    DB.supplierPayments=DB.supplierPayments.filter(x=>x.id!==p.id);
    const idx=DB.cashbook.findIndex(c=>c.source==='supplier-payment' && String(c.note||'')===note && Number(c.amount)===Number(p.amount));
    if(idx>=0) DB.cashbook.splice(idx,1);
    saveDB(); toast('Supplier Payment মুছে ফেলা হয়েছে'); render();
  }));
}

      </tr>`).join('')}</tbody></table>` : `<div class="empty">এখনো কোনো Sales Invoice নেই।</div>`}
    </div>
  </div>`;
}
function saCustomerOptionsHTML(areaId){
  if(!areaId) return `<option value="">— আগে এরিয়া নির্বাচন করুন —</option>`;
  const custs = DB.customers.filter(c=>c.areaId===areaId).sort((a,b)=>a.name.localeCompare(b.name,'bn'));
  const list = custs.map(c=>`<option value="${c.id}">${esc(c.name)}${c.phone?' — '+esc(c.phone):''}</option>`).join('');
  return `<option value="">— Customer নির্বাচন করুন —</option>${list}<option value="__new__">➕ নতুন Customer যুক্ত করুন</option>`;
}
function saProductAreaHTML(){
  const filterCompanyId = document.getElementById('saCompanyFilter').value;
  let prods = DB.products.filter(p=>!filterCompanyId || p.companyId===filterCompanyId);
  if(!prods.length) return `<div class="small-note">${filterCompanyId?'এই কোম্পানির কোনো Product নেই।':'কোনো Product নেই।'}</div>`;
  return `
  <div class="cart-row">
    <select id="saProduct">${prods.map(p=>{
      const st = productStock(p.id);
      return `<option value="${p.id}" data-company="${p.companyId}" data-price="${p.sellingPrice}">${esc(p.name)} ${p.code?('('+esc(p.code)+')'):''} — Stock: ${fmt(st)}</option>`;
    }).join('')}</select>
    <input type="number" id="saQty" placeholder="Quantity" min="0" step="0.01">
    <input type="number" id="saRate" placeholder="Selling Rate" step="0.01">
    <div></div>
    <button class="btn small gold" id="saAddBtn" type="button">+ যোগ করুন</button>
  </div>`;
}
function saCartAreaHTML(){
  if(!salesCart.length) return `<div class="small-note">কোনো আইটেম যোগ করা হয়নি।</div>`;
  const subtotal = salesCart.reduce((s,i)=>s+i.qty*i.rate,0);
  const discountType = document.getElementById('saDiscountType')?.value || 'amount';
  const discountInput = Number(document.getElementById('saDiscount')?.value)||0;
  const discountAmount = discountType==='percent' ? Math.min(subtotal, subtotal*discountInput/100) : Math.min(subtotal, Math.max(0,discountInput));
  const total = Math.max(subtotal-discountAmount,0);
  let profitLine = '';
  if(isAdmin()){
    const grossProfit = salesCart.reduce((sum,i)=>{ const p=productById(i.productId); return sum + ((Number(i.rate)-Number(p?.purchasePrice||0))*Number(i.qty)); },0)-discountAmount;
    const commission = Number(document.getElementById('saCommission')?.value)||0;
    const netProfit = grossProfit-commission;
    const netProfitMargin = total ? (netProfit/total*100) : 0;
    profitLine = ` | Gross Profit: ${money(grossProfit)} | Net Profit: ${money(netProfit)} | Net Profit Margin: ${netProfitMargin.toFixed(2)}%`;
  }
  return `<div class="table-wrap"><table><thead><tr><th>কোম্পানি</th><th>Product</th><th>Qty</th><th>Rate</th><th>Total</th><th></th></tr></thead>
  <tbody>${salesCart.map((it,idx)=>`<tr>
    <td>${esc(companyName(it.companyId))}</td><td>${esc(it.name)}</td><td>${fmt(it.qty)}</td><td>${money(it.rate)}</td><td>${money(it.qty*it.rate)}</td>
    <td><button class="close-x" data-scart-del="${idx}" type="button">✕</button></td>
  </tr>`).join('')}</tbody></table></div>
  <div class="cart-total">Subtotal: ${money(subtotal)} | Discount: ${money(discountAmount)} | Net Total: ${money(total)}${profitLine} | মোট Product: ${salesCart.length} টি | কোম্পানি: ${[...new Set(salesCart.map(i=>i.companyId))].map(companyName).join(', ')}</div>`;
}
function afterSales(){
  // Both admin and non-admin users get the create-challan form (see renderSales) —
  // this shared setup binds the product/cart/save controls for whichever fields
  // are actually present. Non-admin markup omits Commission and the Invoice-only
  // controls, so those bindings are guarded with element-existence checks below.
  salesCart = [];
  const companyFilter = document.getElementById('saCompanyFilter');
  const prodArea = document.getElementById('saProductArea');
  const cartArea = document.getElementById('saCartArea');
  function refreshProdArea(){ prodArea.innerHTML = saProductAreaHTML(); bindAdd(); }
  function refreshCart(){ cartArea.innerHTML = saCartAreaHTML();
    cartArea.querySelectorAll('[data-scart-del]').forEach(b=>b.addEventListener('click', ()=>{
      salesCart.splice(Number(b.dataset.scartDel),1); refreshCart();
    }));
  }
  function bindAdd(){
    const btn = document.getElementById('saAddBtn');
    if(!btn) return;
    btn.addEventListener('click', ()=>{
      const sel = document.getElementById('saProduct');
      const qty = Number(document.getElementById('saQty').value);
      const rate = Number(document.getElementById('saRate').value);
      if(!sel.value || !qty || qty<=0){ alert('Product এবং সঠিক Quantity দিন।'); return; }
      const available = productStock(sel.value);
      const alreadyInCart = salesCart.filter(i=>i.productId===sel.value).reduce((s,i)=>s+i.qty,0);
      if(qty + alreadyInCart > available){
        if(!confirm(`সতর্কতা: বর্তমান Stock (${fmt(available)}) এর চেয়ে বেশি বিক্রি করছেন। চালিয়ে যাবেন?`)) return;
      }
      const opt = sel.options[sel.selectedIndex];
      salesCart.push({productId:sel.value, companyId:opt.dataset.company, name:opt.textContent.split(' — Stock')[0], qty, rate: rate || Number(opt.dataset.price)||0});
      refreshCart();
      document.getElementById('saQty').value=''; document.getElementById('saRate').value='';
    });
  }
  companyFilter.addEventListener('change', refreshProdArea);
  document.getElementById('saDiscountType').addEventListener('change', refreshCart);
  document.getElementById('saDiscount').addEventListener('input', refreshCart);
  if(document.getElementById('saCommission')) document.getElementById('saCommission').addEventListener('input', refreshCart);
  refreshProdArea(); refreshCart();

  // এরিয়া নির্বাচন করলে ঐ এরিয়ার কাস্টমার তালিকা Dropdown-এ লোড হবে।
  const saAreaEl = document.getElementById('saArea');
  const saCustomerSelectEl = document.getElementById('saCustomerSelect');
  const saNewCustomerWrapEl = document.getElementById('saNewCustomerWrap');
  const saCustomerNewEl = document.getElementById('saCustomerNew');
  function refreshCustomerSelect(){
    const areaId = saAreaEl.value;
    saCustomerSelectEl.innerHTML = saCustomerOptionsHTML(areaId);
    saCustomerSelectEl.disabled = !areaId;
    saNewCustomerWrapEl.style.display = 'none';
    saCustomerNewEl.value = '';
  }
  saAreaEl.addEventListener('change', refreshCustomerSelect);
  saCustomerSelectEl.addEventListener('change', ()=>{
    const isNew = saCustomerSelectEl.value==='__new__';
    saNewCustomerWrapEl.style.display = isNew ? '' : 'none';
    if(isNew) saCustomerNewEl.focus();
  });

  document.querySelectorAll('[data-view-challan]').forEach(b=>b.addEventListener('click',()=>openSaleInvoice(b.dataset.viewChallan,false)));

  function saveSaleAndOpen(documentType){
    const areaId = document.getElementById('saArea').value;
    if(!areaId){ alert('এরিয়া নির্বাচন করুন।'); return; }
    const custSelectVal = document.getElementById('saCustomerSelect').value;
    let customerName = '', customerId = '', pendingNewCustomer = null;
    if(custSelectVal==='__new__'){
      customerName = document.getElementById('saCustomerNew').value.trim();
      if(!customerName){ alert('নতুন Customer / Shop নাম দিন।'); return; }
      pendingNewCustomer = {id:uid('cus'), areaId, name:customerName, phone:document.getElementById('saPhone').value.trim()};
      customerId = pendingNewCustomer.id;
    } else if(custSelectVal){
      const c = DB.customers.find(x=>x.id===custSelectVal);
      if(!c){ alert('সঠিক Customer নির্বাচন করুন।'); return; }
      customerName = c.name; customerId = c.id;
    } else {
      alert('Customer / Shop নির্বাচন করুন।'); return;
    }
    if(!salesCart.length){ alert('কমপক্ষে একটি Product যোগ করুন।'); return; }
    const subtotal = salesCart.reduce((s,i)=>s+i.qty*i.rate,0);
    const discountType = document.getElementById('saDiscountType').value || 'amount';
    const discountInput = Number(document.getElementById('saDiscount').value)||0;
    if(discountInput<0){ alert('সঠিক Discount দিন।'); return; }
    const discountAmount = discountType==='percent' ? Math.min(subtotal, subtotal*discountInput/100) : Math.min(subtotal, discountInput);
    const total = Math.max(subtotal-discountAmount,0);
    const commission = Number(document.getElementById('saCommission')?.value)||0;
    if(commission > total){ alert('Commission Discount-এর পরের মোট Invoice-এর চেয়ে বেশি হতে পারবে না।'); return; }
    const paid = Number(document.getElementById('saPaid').value)||0;
    if(paid > total){ alert('Paid Discount-এর পরের মোট Invoice-এর চেয়ে বেশি হতে পারবে না।'); return; }
    const baki = Math.max(total-paid,0);
    const baseGrossProfit = salesCart.reduce((sum,i)=>{ const p=productById(i.productId); return sum + ((Number(i.rate)-Number(p?.purchasePrice||0))*Number(i.qty)); },0);
    const grossProfit = baseGrossProfit-discountAmount;
    const invoiceNo = nextInvoice('sales');
    const companyIds = [...new Set(salesCart.map(i=>i.companyId))];
    // এখন সব validation পাস হয়েছে — নতুন Customer হলে এই মুহূর্তে Master তালিকায় যুক্ত করা হচ্ছে,
    // যাতে পরবর্তী Invoice-এ এই এরিয়ায় এই Customer নাম Dropdown থেকে বেছে নেওয়া যায়।
    if(pendingNewCustomer) DB.customers.push(pendingNewCustomer);
    const sale = {
      id:uid('sal'), invoiceNo, date:document.getElementById('saDate').value||todayStr(),
      companyId:companyIds[0], companyIds,
      areaId, customerId, customerName, customerPhone:document.getElementById('saPhone').value.trim(),
      deliveryMan:document.getElementById('saDeliveryMan').value.trim(),
      items: salesCart.map(i=>{ const p=productById(i.productId); return {productId:i.productId, companyId:i.companyId, qty:i.qty, rate:i.rate, purchasePrice:Number(p?.purchasePrice||0), amount:i.qty*i.rate}; }),
      subtotal, discountType, discountInput, discountAmount, total, paid, baki, commission, grossProfit, netProfit: grossProfit-commission, margin: total?((grossProfit-commission)/total*100):0
    };
    DB.sales.push(sale);
    // Apply the single source of truth for all profit/total calculations.
    recalcSale(sale);
    if(paid>0) addCashbook('in', paid, `Sales Collection - ${invoiceNo}`, 'sales');
    saveDB(); toast(`${documentType==='challan'?'চালান':'Sales Invoice'} ${invoiceNo} সংরক্ষণ হয়েছে`);
    salesCart=[]; render();
    setTimeout(()=>openSaleInvoice(sale.id, documentType==='invoice'),100);
  }
  if(document.getElementById('saSaveChallanBtn')) document.getElementById('saSaveChallanBtn').addEventListener('click',()=>saveSaleAndOpen('challan'));

  // Everything below is Admin-only: Invoice creation/view and Edit/Delete of
  // existing records. Non-admin users stop here with just the challan form above.
  if(!isAdmin()) return;

  if(document.getElementById('saSaveInvoiceBtn')) document.getElementById('saSaveInvoiceBtn').addEventListener('click',()=>saveSaleAndOpen('invoice'));
  document.querySelectorAll('[data-view-sale]').forEach(b=>b.addEventListener('click',()=>openSaleInvoice(b.dataset.viewSale,true)));

  document.querySelectorAll('[data-sale-del]').forEach(btn=>btn.addEventListener('click', ()=>{
    const id = btn.dataset.saleDel; const sale = DB.sales.find(x=>x.id===id); if(!sale) return;
    if(DB.salesReturns.some(r=>r.salesId===id)){ alert('এই Sales Invoice-এর সাথে Sales Return যুক্ত আছে। আগে Return মুছে দিন, তারপর Invoice Delete করুন।'); return; }
    if(!confirm(`Sales Invoice ${sale.invoiceNo} মুছে ফেলবেন?`)) return;
    DB.cashbook = DB.cashbook.filter(c=>!(c.source==='sales' && String(c.note||'').includes(sale.invoiceNo)));
    DB.sales = DB.sales.filter(x=>x.id!==id); saveDB(); toast(`Sales Invoice ${sale.invoiceNo} মুছে ফেলা হয়েছে`); render();
  }));
  document.querySelectorAll('[data-sale-edit]').forEach(btn=>btn.addEventListener('click', ()=>{
    const id = btn.dataset.saleEdit; const sale = DB.sales.find(x=>x.id===id); if(!sale) return;
    const date = prompt('তারিখ (YYYY-MM-DD):', sale.date); if(date===null) return;
    const customerName = prompt('Customer / Shop নাম:', sale.customerName); if(customerName===null) return;
    const phone = prompt('Customer Phone:', sale.customerPhone||''); if(phone===null) return;
    const delivery = prompt('Delivery Man:', sale.deliveryMan||''); if(delivery===null) return;
    const paidStr = prompt('Paid:', String(sale.paid||0)); if(paidStr===null) return;
    const paid = Number(paidStr); if(isNaN(paid)||paid<0){alert('সঠিক Paid দিন।');return;}
    const commissionStr = prompt('Commission (কমিশন):', String(sale.commission||0)); if(commissionStr===null) return;
    const commission = Number(commissionStr); if(isNaN(commission)||commission<0){alert('সঠিক Commission দিন।');return;}
    const subtotal = sale.items.reduce((sum,it)=>sum+Number(it.qty)*Number(it.rate),0);
    const discountType = prompt('Discount Type লিখুন: amount অথবা percent', sale.discountType||'amount'); if(discountType===null) return;
    const dt = String(discountType).toLowerCase()==='percent' ? 'percent' : 'amount';
    const discountInputStr = prompt(dt==='percent'?'Discount %:':'Discount (৳):', String(sale.discountInput||sale.discountAmount||0)); if(discountInputStr===null) return;
    const discountInput = Number(discountInputStr)||0; if(discountInput<0){alert('সঠিক Discount দিন।');return;}
    const discountAmount = dt==='percent' ? Math.min(subtotal, subtotal*discountInput/100) : Math.min(subtotal, discountInput);
    const total = Math.max(subtotal-discountAmount,0);
    if(commission>total){alert('Commission Discount-এর পরের মোট Invoice-এর চেয়ে বেশি হতে পারবে না।');return;}
    if(paid>total){alert('Paid Discount-এর পরের মোট Invoice-এর চেয়ে বেশি হতে পারবে না।');return;}
    sale.subtotal=subtotal; sale.discountType=dt; sale.discountInput=discountInput; sale.discountAmount=discountAmount; sale.commission=commission;
    sale.date=date||sale.date; sale.customerName=customerName.trim()||sale.customerName; sale.customerPhone=phone.trim(); sale.deliveryMan=delivery.trim(); sale.paid=paid;
    // Recalculate from Subtotal - Discount - all linked Damage entries.
    recalcSale(sale);
    DB.cashbook=DB.cashbook.filter(c=>!(c.source==='sales' && String(c.note||'').includes(sale.invoiceNo)));
    if(paid>0) addCashbook('in',paid,`Sales Collection - ${sale.invoiceNo}`,'sales');
    saveDB(); toast(`Sales Invoice ${sale.invoiceNo} আপডেট হয়েছে`); render();
  }));
}

  ${(()=>{const pays=(DB.customerPayments||[]).filter(x=>x.salesId===sale.id).sort((a,b)=>String(a.date).localeCompare(String(b.date))); return pays.length?`<div style="margin-top:24px"><h3 style="margin:0 0 8px">📒 এই Invoice-এর Baki/Collection তালিকা</h3><table><thead><tr><th class="left">তারিখ</th><th class="left">Invoice</th><th class="left">নোট</th><th>Collection</th><th>অবশিষ্ট Baki</th></tr></thead><tbody>${pays.map((x,i)=>{let run=0; const prior=pays.slice(0,i).reduce((a,z)=>a+Number(z.amount||0),0); const remaining=Math.max(Number(sale.total||0)-Number(sale.paid||0)+0,0); return `<tr><td class="left">${esc(x.date)}</td><td class="left">${esc(x.invoiceNo||sale.invoiceNo)}</td><td class="left">${esc(x.note||'—')}</td><td>${money(x.amount)}</td><td>${money(Math.max(Number(sale.total||0)-prior-Number(x.amount||0),0))}</td></tr>`}).join('')}</tbody></table></div>`:`<div style="margin-top:24px;padding:10px;border:1px solid #ccc"><b>📒 এই Invoice-এর Baki/Collection তালিকা:</b> এখনো কোনো আলাদা Collection Entry নেই।</div>`})()}
  <div class="actions"><button onclick="window.print()">Print / Save as PDF</button><button onclick="window.close()">Close</button></div></div></body></html>`);
  win.document.close();
}

let srCart = [];
function srProductAreaHTML(sale){
  if(!sale) return `<div class="small-note">প্রথমে একটি Invoice নির্বাচন করুন।</div>`;
  return `
  <div class="cart-row">
    <select id="srProduct">${sale.items.map(it=>{
      const p = productById(it.productId);
      return `<option value="${it.productId}" data-price="${it.rate}">${esc(p?p.name:'—')} (বিক্রিত Qty: ${fmt(it.qty)})</option>`;
    }).join('')}</select>
    <input type="number" id="srQty" placeholder="Return Qty" min="0" step="0.01">
    <input type="number" id="srRate" placeholder="Return Rate" step="0.01">
    <div></div>
    <button class="btn small gold" id="srAddBtn" type="button">+ যোগ করুন</button>
  </div>`;
}
function srCartAreaHTML(){
  if(!srCart.length) return `<div class="small-note">কোনো আইটেম যোগ করা হয়নি।</div>`;
  const total = srCart.reduce((s,i)=>s+i.qty*i.rate,0);
  return `<div class="table-wrap"><table><thead><tr><th>Product</th><th>Qty</th><th>Rate</th><th>Total</th><th></th></tr></thead>
  <tbody>${srCart.map((it,idx)=>`<tr><td>${esc(it.name)}</td><td>${fmt(it.qty)}</td><td>${money(it.rate)}</td><td>${money(it.qty*it.rate)}</td>
  <td><button class="close-x" data-srcart-del="${idx}" type="button">✕</button></td></tr>`).join('')}</tbody></table></div>
  <div class="cart-total">Total Return: ${money(total)}</div>`;
}
function afterSalesReturn(){
  srCart = [];
  const invSel = document.getElementById('srInvoice');
  if(!invSel) return;
  const prodArea = document.getElementById('srProductArea');
  const cartArea = document.getElementById('srCartArea');
  function refreshProdArea(){
    const sale = DB.sales.find(s=>s.id===invSel.value);
    prodArea.innerHTML = srProductAreaHTML(sale);
    bindAdd();
  }
  function refreshCart(){ cartArea.innerHTML = srCartAreaHTML();
    cartArea.querySelectorAll('[data-srcart-del]').forEach(b=>b.addEventListener('click', ()=>{
      srCart.splice(Number(b.dataset.srcartDel),1); refreshCart();
    }));
  }
  function bindAdd(){
    const btn = document.getElementById('srAddBtn');
    if(!btn) return;
    btn.addEventListener('click', ()=>{
      const sel = document.getElementById('srProduct');
      const qty = Number(document.getElementById('srQty').value);
      const rate = Number(document.getElementById('srRate').value);
      if(!sel.value || !qty || qty<=0){ alert('Product এবং সঠিক Quantity দিন।'); return; }
      const opt = sel.options[sel.selectedIndex];
      srCart.push({productId:sel.value, name:opt.textContent, qty, rate: rate || Number(opt.dataset.price)||0});
      refreshCart();
      document.getElementById('srQty').value=''; document.getElementById('srRate').value='';
    });
  }
  invSel.addEventListener('change', ()=>{ srCart=[]; refreshProdArea(); refreshCart(); });
  refreshProdArea(); refreshCart();

  const saveBtn = document.getElementById('srSaveBtn');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    const sale = DB.sales.find(s=>s.id===invSel.value);
    if(!sale){ alert('Invoice নির্বাচন করুন।'); return; }
    if(!srCart.length){ alert('কমপক্ষে একটি Product যোগ করুন।'); return; }
    const total = srCart.reduce((s,i)=>s+i.qty*i.rate,0);
    // Do not allow the same invoice to be returned beyond the sold quantity.
    for(const ri of srCart){
      const soldItem=sale.items.find(x=>x.productId===ri.productId);
      const soldQty=Number(soldItem?.qty||0);
      const alreadyReturned=linkedSalesReturns(sale)
        .reduce((sum,r)=>sum+(r.items||[]).filter(x=>x.productId===ri.productId)
        .reduce((q,x)=>q+Number(x.qty||0),0),0);
      if(ri.qty>Math.max(soldQty-alreadyReturned,0)){
        alert(`এই Invoice-এ ${ri.productId} এর এত Qty আর Return করা যাবে না।`); return;
      }
    }
    DB.salesReturns.push({
      id:uid('sr'), date:document.getElementById('srDate').value||todayStr(),
      salesId:sale.id, invoiceNo:sale.invoiceNo, customerName:sale.customerName, customerPhone:sale.customerPhone,
      items: srCart.map(i=>({productId:i.productId, qty:i.qty, rate:i.rate, amount:i.qty*i.rate})),
      total
    });
    recalcSale(sale);
    saveDB(); toast(`Sales Return সংরক্ষণ হয়েছে — ${money(total)} Invoice থেকে বাদ হয়েছে`);
    srCart=[]; render();
  });
  document.querySelectorAll('[data-edit-sr]').forEach(b=>b.addEventListener('click',()=>{
    const r=DB.salesReturns.find(x=>x.id===b.dataset.editSr); if(!r) return;
    const date=prompt('Return তারিখ (YYYY-MM-DD):', r.date); if(date===null) return;
    for(const it of r.items){
      const p=productById(it.productId);
      const q=prompt(`${p?p.name:'Product'} — Return Qty:`, it.qty); if(q===null) return;
      const rt=prompt(`${p?p.name:'Product'} — Return Rate:`, it.rate); if(rt===null) return;
      const nq=Number(q), nr=Number(rt); if(!isFinite(nq)||nq<0||!isFinite(nr)||nr<0) return alert('সঠিক Qty ও Rate দিন।');
      it.qty=nq; it.rate=nr; it.amount=nq*nr;
    }
    r.date=date||r.date; r.total=r.items.reduce((sum,it)=>sum+Number(it.amount||0),0);
    const sale=DB.sales.find(s=>s.id===(r.salesId||r.saleId) || s.invoiceNo===r.invoiceNo); if(sale) recalcSale(sale);
    saveDB(); toast(`Sales Return আপডেট হয়েছে — ${money(r.total)} Invoice থেকে বাদ হয়েছে`); render();
  }));
  document.querySelectorAll('[data-del-sr]').forEach(b=>b.addEventListener('click',()=>{
    const r=DB.salesReturns.find(x=>x.id===b.dataset.delSr); if(!r) return;
    if(!confirm(`Return Invoice ${r.invoiceNo} মুছে ফেলবেন?`)) return;
    DB.salesReturns=DB.salesReturns.filter(x=>x.id!==r.id);
    const sale=DB.sales.find(s=>s.id===(r.salesId||r.saleId) || s.invoiceNo===r.invoiceNo); if(sale) recalcSale(sale);
    saveDB(); toast(`Sales Return মুছে ফেলা হয়েছে — Invoice-এর টাকা পুনরায় যোগ হয়েছে`); render();
  }));
}

function openCustomerStatement(name, phone, fromDate='', toDate=''){
  const key = customerKey(name, phone);
  fromDate = String(fromDate||'').trim();
  toDate = String(toDate||'').trim();
  if(fromDate && toDate && fromDate > toDate){
    alert('শুরুর তারিখ শেষ তারিখের পরে হতে পারবে না।');
    return;
  }

  // এই Customer-এর সব Invoice, Sales Return এবং Collection সময় অনুসারে সাজানো হবে।
  // Custom date range দেওয়া থাকলে শুধু সেই সময়ের লেনদেন Statement-এ দেখানো হবে।
  const inRange = d => {
    const date = String(d||'');
    return (!fromDate || date >= fromDate) && (!toDate || date <= toDate);
  };

  const sales = DB.sales
    .filter(s=>customerKey(s.customerName, s.customerPhone)===key && inRange(s.date))
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const returns = (DB.salesReturns||[])
    .filter(r=>customerKey(r.customerName, r.customerPhone)===key && inRange(r.date));
  const unlinkedPayments = (DB.customerPayments||[])
    .filter(p=>!p.salesId && customerKey(p.customerName, p.customerPhone)===key && inRange(p.date));
  const linkedPayments = (DB.customerPayments||[])
    .filter(p=>p.salesId && customerKey(p.customerName, p.customerPhone)===key && inRange(p.date));

  const entries = [];
  sales.forEach(s=>{
    entries.push({date:s.date, particulars:`বিক্রয় চালান ${s.invoiceNo}`, debit:Number(s.total||0), credit:0});
    // Direct Paid is part of the sale-date entry. Payments already recorded as
    // customerPayments are not counted twice.
    const allLinkedForThisSale = (DB.customerPayments||[])
      .filter(p=>p.salesId===s.id)
      .reduce((sum,p)=>sum+Number(p.amount||0),0);
    const initialPaid = Math.max(Number(s.paid||0) - allLinkedForThisSale, 0);
    if(initialPaid>0.000001) entries.push({date:s.date, particulars:`Invoice ${s.invoiceNo} — সরাসরি Paid`, debit:0, credit:initialPaid});
  });
  linkedPayments.forEach(p=>{
    entries.push({date:p.date, particulars:`Invoice ${p.invoiceNo||''} — Collection${p.note?' ('+p.note+')':''}`, debit:0, credit:Number(p.amount||0)});
  });
  unlinkedPayments.forEach(p=>{
    entries.push({date:p.date, particulars:`Collection${p.note?' ('+p.note+')':''}`, debit:0, credit:Number(p.amount||0)});
  });
  returns.forEach(r=>{
    entries.push({date:r.date, particulars:`Sales Return — Invoice ${r.invoiceNo||''}`, debit:0, credit:Number(r.total||0)});
  });
  entries.sort((a,b)=> String(a.date).localeCompare(String(b.date)));

  let running = 0;
  const rows = entries.map(e=>{
    running += e.debit - e.credit;
    return `<tr><td class="left">${esc(e.date)}</td><td class="left">${esc(e.particulars)}</td><td>${e.debit?money(e.debit):'—'}</td><td>${e.credit?money(e.credit):'—'}</td><td>${money(running)}</td></tr>`;
  }).join('');
  const totalDebit = entries.reduce((sum,e)=>sum+e.debit,0);
  const totalCredit = entries.reduce((sum,e)=>sum+e.credit,0);
  const closingBaki = totalDebit - totalCredit;
  const rangeText = fromDate || toDate
    ? ` | সময়কাল: ${esc(fromDate||'শুরু থেকে')} — ${esc(toDate||'আজ পর্যন্ত')}`
    : ' | সময়কাল: সকল তারিখ';

  const win = window.open('', '_blank', 'width=950,height=800');
  if(!win){ alert('Popup blocked হয়েছে। Browser-এ popup allow করুন।'); return; }
  win.document.write(`<!doctype html><html lang="bn"><head><meta charset="UTF-8"><title>Customer Statement - ${esc(name)}</title>

function renderStatement(){
  const areaOptions = `<option value="">— এরিয়া নির্বাচন করুন —</option>` + DB.areas.slice().sort((a,b)=>a.name.localeCompare(b.name,'bn')).map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');
  return `

    <div class="panel-body">
      <div class="small-note" style="margin-bottom:14px;">এরিয়া ও Customer নির্বাচন করে চাইলে নির্দিষ্ট তারিখ থেকে নির্দিষ্ট তারিখ পর্যন্ত Statement দেখুন। তারিখ ফাঁকা রাখলে সব তারিখের লেনদেন দেখাবে।</div>
      <div class="form-grid">
        <div class="f-item"><label>এরিয়া *</label><select id="stArea">${areaOptions}</select></div>
        <div class="f-item"><label>Customer *</label><select id="stCustomer" disabled><option value="">— আগে এরিয়া নির্বাচন করুন —</option></select></div>
        <div class="f-item"><label>শুরুর তারিখ</label><input type="date" id="stFrom"></div>
        <div class="f-item"><label>শেষ তারিখ</label><input type="date" id="stTo"></div>
        <div class="f-item" style="align-self:end;"><button class="btn gold" id="stViewBtn" style="width:100%;" type="button" disabled>📄 Statement দেখুন (PDF)</button></div>
      </div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>এরিয়ার কাস্টমার তালিকা ও বর্তমান Baki</h3></div>
    <div class="panel-body table-wrap" id="stAreaCustTable"><div class="empty">প্রথমে এরিয়া নির্বাচন করুন।</div></div>
  </div>`;
}
function afterStatement(){
  const areaSel = document.getElementById('stArea');
  const custSel = document.getElementById('stCustomer');
  const viewBtn = document.getElementById('stViewBtn');
  const areaCustTable = document.getElementById('stAreaCustTable');
  const fromDate = document.getElementById('stFrom');
  const toDate = document.getElementById('stTo');

  function refreshForArea(){
    const areaId = areaSel.value;
    custSel.value = '';
    viewBtn.disabled = true;
    if(!areaId){
      custSel.innerHTML = '<option value="">— আগে এরিয়া নির্বাচন করুন —</option>';
      custSel.disabled = true;
      areaCustTable.innerHTML = '<div class="empty">প্রথমে এরিয়া নির্বাচন করুন।</div>';
      ST_AREA_CUSTOMERS = [];
      return;
    }
    const custs = DB.customers.filter(c=>c.areaId===areaId).slice().sort((a,b)=>a.name.localeCompare(b.name,'bn'));
    custSel.disabled = false;
    custSel.innerHTML = custs.length
      ? `<option value="">— Customer নির্বাচন করুন —</option>` + custs.map(c=>`<option value="${c.id}">${esc(c.name)}${c.phone?' — '+esc(c.phone):''}</option>`).join('')
      : `<option value="">এই এরিয়ায় কোনো Customer যুক্ত করা হয়নি</option>`;

    const allC = allCustomers();
    ST_AREA_CUSTOMERS = custs.map(c=>{
      const match = allC.find(x=>customerKey(x.name,x.phone)===customerKey(c.name,c.phone));
      return {c, baki: match ? match.baki : 0};
    });
    areaCustTable.innerHTML = ST_AREA_CUSTOMERS.length
      ? `<table><thead><tr><th>Customer</th><th>ফোন</th><th>বর্তমান Baki</th><th>Statement</th></tr></thead>
      <tbody>${ST_AREA_CUSTOMERS.map((r,idx)=>`<tr><td>${esc(r.c.name)}</td><td>${esc(r.c.phone||'—')}</td>
        <td>${r.baki>0?`<span class="tag due">${money(r.baki)}</span>`:money(r.baki)}</td>
        <td><button class="btn small" data-area-cust-statement="${idx}" type="button">📄 PDF</button></td></tr>`).join('')}</tbody></table>`
      : `<div class="empty">এই এরিয়ায় কোনো Customer যুক্ত করা হয়নি। প্রথমে "এরিয়া ও কাস্টমার" থেকে Customer যুক্ত করুন।</div>`;
    document.querySelectorAll('[data-area-cust-statement]').forEach(b=>b.addEventListener('click', ()=>{
      const r = ST_AREA_CUSTOMERS[Number(b.dataset.areaCustStatement)];
      if(r) openCustomerStatement(r.c.name, r.c.phone, fromDate.value, toDate.value);
    }));
  }
  areaSel.addEventListener('change', refreshForArea);
  custSel.addEventListener('change', ()=>{ viewBtn.disabled = !custSel.value; });
  viewBtn.addEventListener('click', ()=>{
    const c = DB.customers.find(x=>x.id===custSel.value);
    if(!c) return;
    openCustomerStatement(c.name, c.phone, fromDate.value, toDate.value);
  });
  function validateDates(){
    if(fromDate.value && toDate.value && fromDate.value > toDate.value){
      viewBtn.disabled = true;
      alert('শুরুর তারিখ শেষ তারিখের পরে হতে পারবে না।');
      return false;
    }
    viewBtn.disabled = !custSel.value;
    return true;
  }
  fromDate.addEventListener('change', validateDates);
  toDate.addEventListener('change', validateDates);
  refreshForArea();
}

function afterCustomerBaki(){
  document.querySelectorAll('[data-cust-statement]').forEach(b=>b.addEventListener('click', ()=>{
    const c = CB_CUSTOMERS[Number(b.dataset.custStatement)];
    if(!c) return;
    openCustomerStatement(c.name, c.phone);
  }));
  const invoiceDate = document.getElementById('cpInvoiceDate');
  const invoiceSelect = document.getElementById('cpInvoiceNo');
  const amountInput = document.getElementById('cpInvoiceAmount');

  function invoicesByDate(){
    if(!invoiceSelect) return;
    const date = invoiceDate.value;
    const rows=(DB.sales||[]).filter(s=>String(s.date||'')===String(date||'') && Number(s.baki||0)>0);
    invoiceSelect.innerHTML='<option value="">Invoice নির্বাচন করুন</option>'+rows.map(s=>`<option value="${s.id}">${esc(s.invoiceNo)} — ${esc(s.customerName||'Customer')} — Baki: ${money(s.baki||0)}</option>`).join('');
    updateInvoiceInfo();
  }
  function updateInvoiceInfo(){
    if(!invoiceSelect) return;
    const s=DB.sales.find(x=>x.id===invoiceSelect.value);
    const set=(id,val)=>{const el=document.getElementById(id);if(el)el.value=val;};
    set('cpInvoiceCustomer',s?s.customerName||'':'');
    set('cpInvoiceTotal',s?money(s.total||0):'');
    set('cpInvoicePaid',s?money(s.paid||0):'');
    set('cpInvoiceBaki',s?money(s.baki||0):'');
    if(amountInput){amountInput.max=s?String(Math.max(Number(s.baki||0),0)):'';}
  }
  if(invoiceDate) invoiceDate.addEventListener('change', invoicesByDate);
  if(invoiceSelect) invoiceSelect.addEventListener('change', updateInvoiceInfo);

  document.querySelectorAll('[data-select-cp-invoice]').forEach(b=>b.addEventListener('click',()=>{
    const s=DB.sales.find(x=>x.id===b.dataset.selectCpInvoice); if(!s)return;
    if(invoiceDate) invoiceDate.value=s.date||todayStr();
    invoicesByDate();
    if(invoiceSelect){invoiceSelect.value=s.id;updateInvoiceInfo();}
    const panel=document.getElementById('cpInvoiceForm');
    if(panel) panel.scrollIntoView({behavior:'smooth',block:'center'});
  }));

  if(invoiceSelect) invoicesByDate();

  const f=document.getElementById('cpInvoiceForm');
  if(f) f.addEventListener('submit',e=>{
    e.preventDefault();
    const s=DB.sales.find(x=>x.id===invoiceSelect.value);
    const amount=Number(amountInput.value||0);
    if(!s)return alert('একটি নির্দিষ্ট Invoice নির্বাচন করুন।');
    const baki=Number(s.baki||0);
    if(!amount || amount<=0)return alert('সঠিক Collection Amount দিন।');
    if(amount>baki+0.000001)return alert(`এই Invoice-এর সর্বোচ্চ Baki ${money(baki)}।`);
    const date=document.getElementById('cpInvoiceCollectionDate').value||todayStr();
    const note=document.getElementById('cpInvoiceNote').value.trim();
    const id=uid('cp');
    const oldPaid=Number(s.paid||0);
    s.paid=oldPaid+amount;
    s.baki=Math.max(Number(s.total||0)-s.paid,0);
    DB.customerPayments.push({id,date,salesId:s.id,invoiceNo:s.invoiceNo,customerName:s.customerName,customerPhone:s.customerPhone,amount,note,previousPaid:oldPaid});
    DB.cashbook.push({id:uid('cb'),date,type:'in',amount,note:`Customer Baki Collection - Invoice ${s.invoiceNo}`,source:'customer-payment',refId:id});
    saveDB(); toast(`Invoice ${s.invoiceNo}-এর Baki থেকে ${money(amount)} বাদ হয়েছে`); render();
  });

  document.querySelectorAll('[data-edit-cp]').forEach(b=>b.addEventListener('click',()=>{
    const p=DB.customerPayments.find(x=>x.id===b.dataset.editCp); if(!p)return;
    if(!p.salesId){
      const date=prompt('Collection তারিখ (YYYY-MM-DD):',p.date);if(date===null)return;
      const amount=Number(prompt('Collection Amount:',Number(p.amount)||0));if(!amount||amount<=0)return alert('সঠিক Collection Amount দিন।');
      const note=prompt('নোট:',p.note||'');if(note===null)return;
      const old=Number(p.amount)||0;p.date=date||p.date;p.amount=amount;p.note=note;
      const cb=DB.cashbook.find(c=>c.source==='customer-payment'&&c.refId===p.id);
      if(cb){cb.amount=amount;cb.date=p.date;cb.note=`Customer Collection - ${p.customerName}`;}
      saveDB();toast('Customer Collection আপডেট হয়েছে');render();return;
    }
    const s=DB.sales.find(x=>x.id===p.salesId);
    if(!s)return alert('এই Collection-এর Invoice আর পাওয়া যাচ্ছে না।');
    const oldAmount=Number(p.amount)||0;
    const maxNew=Number(s.baki||0)+oldAmount;
    const amount=Number(prompt(`Invoice ${s.invoiceNo}-এর নতুন Collection Amount:`,String(oldAmount)));
    if(!amount||amount<=0)return alert('সঠিক Collection Amount দিন।');
    if(amount>maxNew+0.000001)return alert(`সর্বোচ্চ ${money(maxNew)} Collection করা যাবে।`);
    const date=prompt('Collection তারিখ (YYYY-MM-DD):',p.date);if(date===null)return;
    const note=prompt('নোট:',p.note||'');if(note===null)return;
    s.paid=Math.max(Number(s.paid||0)-oldAmount+amount,0);
    s.baki=Math.max(Number(s.total||0)-s.paid,0);
    p.amount=amount;p.date=date||p.date;p.note=note;
    const cb=DB.cashbook.find(c=>c.source==='customer-payment'&&c.refId===p.id);
    if(cb){cb.amount=amount;cb.date=p.date;cb.note=`Customer Baki Collection - Invoice ${s.invoiceNo}`;}
    saveDB();toast(`Invoice ${s.invoiceNo}-এর Collection আপডেট হয়েছে`);render();
  }));

  document.querySelectorAll('[data-del-cp]').forEach(b=>b.addEventListener('click',()=>{
    const p=DB.customerPayments.find(x=>x.id===b.dataset.delCp);if(!p)return;
    if(!confirm(`${p.invoiceNo?`Invoice ${p.invoiceNo}-এর `:''}${money(p.amount)} Collection মুছে ফেলবেন?`))return;
    if(p.salesId){
      const s=DB.sales.find(x=>x.id===p.salesId);
      if(s){s.paid=Math.max(Number(s.paid||0)-Number(p.amount||0),0);s.baki=Math.max(Number(s.total||0)-s.paid,0);}
    }
    DB.customerPayments=DB.customerPayments.filter(x=>x.id!==p.id);
    const idx=DB.cashbook.findIndex(c=>c.source==='customer-payment'&&c.refId===p.id);
    if(idx>=0)DB.cashbook.splice(idx,1);
    saveDB();toast('Customer Collection মুছে ফেলা হয়েছে এবং Invoice Baki পুনরায় সমন্বয় হয়েছে');render();
  }));
}

      <div class="table-wrap" id="employeeTable"></div>
